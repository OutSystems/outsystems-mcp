name: plugin-version

# Checks that every file that carries the plugin version agrees. It has no
# path filter, so it also guards a file that starts to carry the version,
# and it reports on every pull request, so it can be a required check.
# No pull request has to raise the version: the release pull request does,
# and `release.yml` checks on the tag that the version went up (see
# CONTRIBUTING.md "Versioning and Releases"). This workflow only runs the
# self-test of that check, so a broken check is caught before a release.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-version-lockstep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check the plugin version in every file that carries it
        run: bash .github/tests/plugin-version-lockstep.test.sh

  plugin-version-bump-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Test the version bump check that the release workflow runs
        run: bash .github/tests/plugin-version-bump.test.sh
