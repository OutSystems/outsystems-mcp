name: skills-tests

# Offline tests for the bundled Beta skills' scripts (tests/skills), plus the
# check that the Cursor and Kiro copies match the Claude source. Needs no
# tenant and no secrets.

on:
  pull_request:
    paths:
      - "claude/skills/outsystems-*/**"
      - "cursor/skills/outsystems-*/**"
      - "kiro/outsystems/skills/outsystems-*/**"
      - "tests/skills/**"
      - ".github/workflows/skills-tests.yml"
  push:
    branches: [main]
    paths:
      - "claude/skills/outsystems-*/**"
      - "cursor/skills/outsystems-*/**"
      - "kiro/outsystems/skills/outsystems-*/**"
      - "tests/skills/**"
      - ".github/workflows/skills-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The skills promise Python 3.7+; 3.8 is the oldest setup-python
        # still provides on ubuntu-latest.
        python-version: ["3.8", "3.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest (the scripts themselves use only the standard library)
        run: python -m pip install --upgrade pytest

      - name: Run the skill suites
        run: python -m pytest -q -p no:cacheprovider tests/skills
