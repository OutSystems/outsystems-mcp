<!DOCTYPE html>
<!--
  template-version: 1.6.0
  Generated by the `outsystems-app-architecture` skill.
  Populate via `scripts/build.py <cache-dir> <output-path> --app-info ... etc.`.
  Placeholder: /*__APP_DATA__*/

  The app data is inlined; the graph library (vis-network, pinned to 9.1.9
  with a Subresource Integrity hash) and the fonts load from CDNs. Offline, or
  if the CDN serves anything but the pinned file, the page shows a plain HTML
  listing of the same data instead of the graph, and falls back to system fonts.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OutSystems App Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"
          integrity="sha384-yxKDWWf0wwdUj/gPeuL11czrnKFQROnLgY8ll7En9NYoXibgg3C6NK/UDHNtUgWJ"
          crossorigin="anonymous"></script>
  <style>
    :root {
      --os-bg: #0A0A0F;
      --os-bg-2: #11111A;
      --os-card: #161620;
      --os-card-2: #1C1C28;
      --os-border: #262633;
      --os-border-strong: #353548;
      --os-text: #F5F5F7;
      --os-text-muted: #9B9BA8;
      --os-text-dim: #6B6B7A;
      --os-red: #FF3D52;
      --os-red-dark: #C42030;
      --os-red-glow: rgba(255, 61, 82, 0.18);

      --c-app: #FF3D52;
      --c-uiflow: #FBBF24;
      --c-screen: #FF8DA0;
      --c-action: #60A5FA;
      --c-function: #A78BFA;
      --c-entity: #34D399;
      --c-enum: #14B8A6;
      --c-structure: #22D3EE;
      --c-role: #FB923C;
      --c-inherited: #5B5B6E;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--os-bg);
      color: var(--os-text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      letter-spacing: -0.01em;
      overflow: hidden;
    }
    .app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }

    /* Empty state */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 16px; padding: 40px; text-align: center;
    }
    .empty-state .mark {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, var(--os-red) 0%, var(--os-red-dark) 100%);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: white; font-size: 28px;
      box-shadow: 0 10px 40px var(--os-red-glow);
    }
    .empty-state h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
    .empty-state p { color: var(--os-text-muted); max-width: 500px; line-height: 1.55; font-size: 14px; }
    .empty-state code {
      background: var(--os-card); padding: 2px 8px; border-radius: 5px;
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      border: 1px solid var(--os-border); color: var(--os-text);
    }

    /* Header */
    header.topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px;
      background: linear-gradient(180deg, #0E0E16 0%, #0A0A0F 100%);
      border-bottom: 1px solid var(--os-border);
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, var(--os-red) 0%, var(--os-red-dark) 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px var(--os-red-glow);
      font-weight: 800; color: white; font-size: 18px;
    }
    .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .brand-sub { font-size: 12px; color: var(--os-text-muted); margin-top: 2px; }
    .header-meta { display: flex; gap: 22px; align-items: center; }
    .meta-item { display: flex; flex-direction: column; }
    .meta-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--os-text-dim); font-weight: 600;
    }
    .meta-value { font-size: 13px; color: var(--os-text); font-weight: 500; margin-top: 3px; }
    .meta-value.pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--os-card-2); border: 1px solid var(--os-border);
      padding: 3px 10px; border-radius: 999px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
    }
    .pulse {
      width: 7px; height: 7px; border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6); }
      70% { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      padding: 14px 28px;
      background: var(--os-bg);
      border-bottom: 1px solid var(--os-border);
    }
    .stat {
      background: linear-gradient(180deg, var(--os-card) 0%, var(--os-card-2) 100%);
      border: 1px solid var(--os-border);
      border-radius: 10px;
      padding: 10px 12px;
      position: relative; overflow: hidden;
    }
    .stat::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent, var(--os-red));
    }
    .stat-label {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--os-text-muted); font-weight: 600;
    }
    .stat-value {
      font-size: 22px; font-weight: 700; color: var(--os-text);
      margin-top: 4px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
    }
    .stat-detail { font-size: 10px; color: var(--os-text-dim); margin-top: 1px; }

    /* Main */
    main {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100%;
      overflow: hidden;
    }
    aside.sidebar {
      background: var(--os-bg-2);
      border-right: 1px solid var(--os-border);
      padding: 18px 18px;
      overflow-y: auto;
    }
    .panel-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--os-text-muted); font-weight: 600;
      margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-title button {
      background: none; border: none; color: var(--os-red);
      font-size: 10px; letter-spacing: 0.08em; cursor: pointer; font-weight: 600;
    }
    .panel-title button:hover { color: #ff7184; }

    .search {
      width: 100%;
      background: var(--os-card); border: 1px solid var(--os-border);
      border-radius: 8px; color: var(--os-text);
      padding: 8px 12px; font-size: 13px; font-family: inherit;
      margin-bottom: 18px; outline: none;
    }
    .search:focus { border-color: var(--os-red); box-shadow: 0 0 0 3px var(--os-red-glow); }

    .filter-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 22px; }
    .filter-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 8px; border-radius: 7px;
      cursor: pointer; user-select: none;
      transition: background 120ms;
    }
    .filter-row:hover { background: var(--os-card); }
    .filter-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .filter-row .filter-name { flex: 1; font-size: 13px; color: var(--os-text); }
    .filter-row.is-off .filter-name { color: var(--os-text-dim); text-decoration: line-through; opacity: 0.6; }
    .filter-row.is-off .filter-swatch { opacity: 0.35; }
    .filter-count {
      font-size: 11px; color: var(--os-text-muted);
      font-variant-numeric: tabular-nums;
      background: var(--os-card); padding: 2px 7px; border-radius: 999px;
      border: 1px solid var(--os-border);
    }
    .filter-row.is-off .filter-count { opacity: 0.4; }

    .ctx-block {
      background: var(--os-card); border: 1px solid var(--os-border);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
    }
    .ctx-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px; gap: 12px; }
    .ctx-row + .ctx-row { border-top: 1px solid var(--os-border); }
    .ctx-key { color: var(--os-text-muted); }
    .ctx-val { color: var(--os-text); font-weight: 500; }

    /* Graph */
    .graph-wrap {
      position: relative;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 61, 82, 0.04) 0%, transparent 60%),
        var(--os-bg);
      overflow: hidden;
    }
    #network { width: 100%; height: 100%; }
    .graph-overlay {
      position: absolute; top: 16px; right: 16px;
      background: rgba(15, 15, 22, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid var(--os-border);
      border-radius: 10px;
      padding: 14px 16px;
      width: 360px; max-width: calc(100% - 32px);
      max-height: calc(100% - 90px); overflow-y: auto;
      pointer-events: none;
      opacity: 0; transition: opacity 150ms;
    }
    .graph-overlay.is-visible { opacity: 1; pointer-events: auto; }
    .ov-section { margin-top: 10px; }
    .ov-section-title {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--os-text-dim); font-weight: 600; margin-bottom: 4px;
    }
    .ov-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .ov-table td { padding: 3px 4px; border-top: 1px solid var(--os-border); vertical-align: top; color: var(--os-text-muted); }
    .ov-table td:first-child { color: var(--os-text); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; white-space: nowrap; }
    .ov-tag {
      display: inline-block; font-size: 9px; padding: 0 5px; margin-left: 4px; border-radius: 4px;
      border: 1px solid var(--os-border-strong); color: var(--os-text-muted);
    }
    .ov-note { font-size: 10.5px; color: var(--os-text-dim); line-height: 1.4; margin-top: 4px; }

    /* Fallback listing (graph library unavailable) */
    .fallback { padding: 24px 28px; overflow-y: auto; height: 100%; }
    .fallback-banner {
      background: var(--os-card); border: 1px solid var(--os-red); border-radius: 10px;
      padding: 12px 16px; margin-bottom: 18px; font-size: 13px; line-height: 1.5; color: var(--os-text);
    }
    .fallback h2 { font-size: 14px; margin: 18px 0 6px; color: var(--os-text); }
    .fallback ul { margin: 0; padding-left: 20px; font-size: 12.5px; color: var(--os-text-muted); line-height: 1.6; }
    .fallback li strong { color: var(--os-text); font-weight: 600; }
    .overlay-title {
      font-size: 14px; font-weight: 600; color: var(--os-text);
      margin-bottom: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .overlay-type {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--os-text-dim); margin-bottom: 8px;
    }
    .overlay-desc {
      font-size: 11px; color: var(--os-text-muted);
      line-height: 1.45; margin-bottom: 8px;
      max-height: 140px; overflow: hidden;
    }

    .legend-floating {
      position: absolute; bottom: 16px; left: 16px;
      background: rgba(15, 15, 22, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid var(--os-border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 11px; color: var(--os-text-muted);
      display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
      max-width: calc(100% - 200px);
    }
    .legend-floating > div { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    .graph-controls {
      position: absolute; bottom: 16px; right: 16px;
      display: flex; gap: 8px;
    }
    .ctrl-btn {
      background: rgba(15, 15, 22, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--os-border);
      color: var(--os-text);
      width: 36px; height: 36px; border-radius: 8px;
      cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: all 120ms;
    }
    .ctrl-btn:hover { border-color: var(--os-red); color: var(--os-red); }

    aside.sidebar::-webkit-scrollbar { width: 6px; }
    aside.sidebar::-webkit-scrollbar-track { background: transparent; }
    aside.sidebar::-webkit-scrollbar-thumb { background: var(--os-border-strong); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="app-root"></div>

  <template id="tpl-app">
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" id="hdr-mark">A</div>
          <div>
            <div class="brand-name" id="hdr-name">App Architecture</div>
            <div class="brand-sub" id="hdr-sub">—</div>
          </div>
        </div>
        <div class="header-meta">
          <div class="meta-item">
            <span class="meta-label">App Key</span>
            <span class="meta-value pill" id="hdr-key">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Revision</span>
            <span class="meta-value" id="hdr-rev">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Type</span>
            <span class="meta-value" id="hdr-type">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Deployed</span>
            <span class="meta-value" style="display:flex;align-items:center;gap:8px;"><span class="pulse" id="hdr-pulse" style="display:none"></span><span id="hdr-deployed">—</span></span>
          </div>
        </div>
      </header>

      <section class="stats">
        <div class="stat" style="--accent: var(--c-uiflow)">
          <div class="stat-label">UI Flows</div>
          <div class="stat-value" id="stat-flows">—</div>
          <div class="stat-detail">screens grouped</div>
        </div>
        <div class="stat" style="--accent: var(--c-screen)">
          <div class="stat-label">Screens</div>
          <div class="stat-value" id="stat-screens">—</div>
          <div class="stat-detail">UI surfaces</div>
        </div>
        <div class="stat" style="--accent: var(--c-action)">
          <div class="stat-label">Server Actions</div>
          <div class="stat-value" id="stat-actions">—</div>
          <div class="stat-detail">server-side logic</div>
        </div>
        <div class="stat" style="--accent: var(--c-function)">
          <div class="stat-label">Client Actions</div>
          <div class="stat-value" id="stat-client">—</div>
          <div class="stat-detail">client-side logic</div>
        </div>
        <div class="stat" style="--accent: var(--c-entity)">
          <div class="stat-label">Entities</div>
          <div class="stat-value" id="stat-entities">—</div>
          <div class="stat-detail">business data</div>
        </div>
        <div class="stat" style="--accent: var(--c-enum)">
          <div class="stat-label">Enums</div>
          <div class="stat-value" id="stat-enums">—</div>
          <div class="stat-detail">static</div>
        </div>
        <div class="stat" style="--accent: var(--c-structure)">
          <div class="stat-label">Structures</div>
          <div class="stat-value" id="stat-structures">—</div>
          <div class="stat-detail">DTOs</div>
        </div>
        <div class="stat" style="--accent: var(--c-role)">
          <div class="stat-label">Roles</div>
          <div class="stat-value" id="stat-roles">—</div>
          <div class="stat-detail">security</div>
        </div>
      </section>

      <main>
        <aside class="sidebar">
          <div class="panel-title"><span>App Context</span></div>
          <div class="ctx-block" id="ctx-block">
            <div class="ctx-row"><span class="ctx-key">Asset Key</span><span class="ctx-val" id="ctx-key" style="font-family:'JetBrains Mono',monospace;font-size:10px;">—</span></div>
            <div class="ctx-row"><span class="ctx-key">Type</span><span class="ctx-val" id="ctx-type">—</span></div>
            <div class="ctx-row"><span class="ctx-key">Revision</span><span class="ctx-val" id="ctx-rev">—</span></div>
            <div class="ctx-row"><span class="ctx-key">Updated</span><span class="ctx-val" id="ctx-date">—</span></div>
            <div class="ctx-row"><span class="ctx-key">Inherited items</span><span class="ctx-val" id="ctx-inherited">—</span></div>
          </div>

          <div id="deps-unavailable" class="ctx-block" style="display:none;color:var(--os-text-muted);font-size:11px;margin-bottom:12px"></div>

          <div id="deploy-wrap" style="display:none">
            <div class="panel-title"><span>Deployments</span><span id="deploy-asof" style="font-size:9px;letter-spacing:0.04em;text-transform:none;color:var(--os-text-dim)"></span></div>
            <div class="ctx-block" id="deploy-block"></div>
          </div>

          <div id="filters-wrap">
            <div class="panel-title">
              <span>Filter by Category</span>
              <button id="filter-reset">RESET</button>
            </div>
            <input class="search" id="search" type="text" placeholder="Search by name…" />
            <div class="filter-list" id="filter-list"></div>

            <div class="panel-title"><span>Relationships</span></div>
            <div class="filter-list" id="edge-filter-list"></div>
          </div>

          <div class="panel-title"><span>Layers</span></div>
          <div class="ctx-block" style="padding:10px 12px;font-size:11px;line-height:1.6;">
            <div style="color:var(--os-text-muted);"><strong style="color:var(--c-screen);">UI</strong> &nbsp;UI Flows → Screens</div>
            <div style="color:var(--os-text-muted);"><strong style="color:var(--c-action);">Logic</strong> &nbsp;Server, Client and Service Actions</div>
            <div style="color:var(--os-text-muted);"><strong style="color:var(--c-entity);">Data</strong> &nbsp;Entities · Enums · Structures</div>
            <div style="color:var(--os-text-muted);"><strong style="color:var(--c-role);">Security</strong> &nbsp;Roles</div>
            <div style="color:var(--os-text-muted);"><strong style="color:#FF3D52;">Dependencies</strong> &nbsp;AI Models · Libraries</div>
          </div>
        </aside>

        <div class="graph-wrap">
          <div id="network"></div>
          <div class="graph-overlay" id="overlay">
            <div class="overlay-title" id="ov-title"></div>
            <div class="overlay-type" id="ov-type"></div>
            <div class="overlay-desc" id="ov-desc"></div>
            <div id="ov-detail"></div>
          </div>
          <div class="legend-floating">
            <div><span class="legend-dot" style="background:var(--c-app)"></span>App</div>
            <div><span class="legend-dot" style="background:var(--c-uiflow)"></span>UI Flow</div>
            <div><span class="legend-dot" style="background:var(--c-screen)"></span>Screen</div>
            <div><span class="legend-dot" style="background:var(--c-action)"></span>Action</div>
            <div><span class="legend-dot" style="background:var(--c-function)"></span>Client Action</div>
            <div><span class="legend-dot" style="background:#F59E0B"></span>Service Action</div>
            <div><span class="legend-dot" style="background:var(--c-entity)"></span>Entity</div>
            <div><span class="legend-dot" style="background:var(--c-enum)"></span>Enum</div>
            <div><span class="legend-dot" style="background:var(--c-structure)"></span>Structure</div>
            <div><span class="legend-dot" style="background:var(--c-role)"></span>Role</div>
            <div><span class="legend-dot" style="background:#FF3D52"></span>AI Model</div>
            <div><span class="legend-dot" style="background:#F472B6"></span>Library</div>
            <div style="color:var(--os-text-dim);font-size:10px;margin-left:4px;">Scroll · Drag · Click</div>
          </div>
          <div class="graph-controls">
            <button class="ctrl-btn" id="zoom-fit" title="Fit">⤢</button>
            <button class="ctrl-btn" id="zoom-in" title="Zoom in">+</button>
            <button class="ctrl-btn" id="zoom-out" title="Zoom out">−</button>
          </div>
        </div>
      </main>
    </div>
  </template>

  <template id="tpl-empty">
    <div class="empty-state">
      <div class="mark">A</div>
      <h1>Template not yet populated</h1>
      <p>
        This is the bare <code>template.html</code> shipped with the
        <code>outsystems-app-architecture</code> skill. Run the skill
        through Claude Code (or invoke <code>scripts/build.py</code> directly)
        to populate it with your app data.
      </p>
      <p style="font-size: 12px;">Expected placeholder: <code>/*__APP_DATA__*/</code>.</p>
    </div>
  </template>

  <script>
    // ============================================================
    // Data — populated by build.py. Do not edit by hand.
    // ============================================================
    const APP_DATA = /*__APP_DATA__*/null;

    // Same file, same hash as the unpkg <script> tag in <head>; tried when
    // unpkg fails, is blocked, or serves a file that fails the integrity check.
    const VIS_SRI      = "sha384-yxKDWWf0wwdUj/gPeuL11czrnKFQROnLgY8ll7En9NYoXibgg3C6NK/UDHNtUgWJ";
    const VIS_FALLBACK = "https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js";

    // ============================================================
    // Boot
    // ============================================================
    const root = document.getElementById('app-root');
    if (!APP_DATA || !APP_DATA.app) {
      root.appendChild(document.getElementById('tpl-empty').content.cloneNode(true));
    } else {
      root.appendChild(document.getElementById('tpl-app').content.cloneNode(true));
      withVis(boot);
    }

    // Runs `then` once the graph library is available: the unpkg copy loaded
    // by <head>, else the same pinned file from jsDelivr, else without it
    // (boot() then lists the data as plain HTML).
    function withVis(then) {
      if (typeof vis !== 'undefined') return then();
      let done = false;
      const go = () => { if (!done) { done = true; then(); } };
      const s = document.createElement('script');
      s.src = VIS_FALLBACK; s.integrity = VIS_SRI; s.crossOrigin = 'anonymous';
      s.onload = go; s.onerror = go;
      document.head.appendChild(s);
      setTimeout(go, 10000);
    }

    // Small DOM helpers. App data goes in through textContent only: names and
    // descriptions come from the tenant and are not trusted HTML.
    function el(tag, text, cls) {
      const e = document.createElement(tag);
      if (text !== undefined && text !== null) e.textContent = String(text);
      if (cls) e.className = cls;
      return e;
    }
    function byName(a, b) { return (a.n || '').toLowerCase() < (b.n || '').toLowerCase() ? -1 : 1; }
    // Primary key first, then by name: the payload's attribute order is not Studio's.
    function sortAttrs(attrs) {
      return (attrs || []).slice().sort((a, b) => (b.pk ? 1 : 0) - (a.pk ? 1 : 0) || byName(a, b));
    }
    function fkLabel(fk) {
      if (!fk) return '';
      if (fk.in === 'external') return `→ ${fk.n} (not in this app's data)`;
      if (fk.in === 'owned') return `→ ${fk.n}`;
      return `→ ${fk.n} (${fk.from || fk.in})`;
    }
    function attrType(a) {
      const bits = [a.t || '?'];
      if (a.len) bits.push(`(${a.len})`);
      return bits.join(' ');
    }
    function paramText(p) { return `${p.n}: ${p.t || '?'}${p.req ? ' *' : ''}`; }

    function boot() {
      const D = APP_DATA;
      const app = D.app;

      // ----- Header + sidebar context -----
      document.title = `${app.name} — App Architecture`;
      document.getElementById('hdr-mark').textContent = (app.name || 'A').charAt(0).toUpperCase();
      document.getElementById('hdr-name').textContent = `${app.name} — Architecture`;
      document.getElementById('hdr-sub').textContent  = app.description || app.type;
      document.getElementById('hdr-key').textContent  = `${(app.key || '').slice(0,8)} · ${app.name}`;
      document.getElementById('hdr-rev').textContent  = `r${app.revision}`;
      document.getElementById('hdr-type').textContent = app.type;
      document.getElementById('ctx-key').textContent  = `${(app.key||'').slice(0,8)}…${(app.key||'').slice(-5)}`;
      document.getElementById('ctx-type').textContent = app.type;
      document.getElementById('ctx-rev').textContent  = `r${app.revision}`;
      document.getElementById('ctx-date').textContent = app.date || '—';
      document.getElementById('ctx-inherited').textContent = (D.inheritedBuiltinCount ? `${D.inheritedCount || 0} (${D.inheritedBuiltinCount} platform, hidden)` : String(D.inheritedCount || 0));

      // ----- Dependencies that could not be fetched (never shown as "none") -----
      if ((D.depsUnavailable || []).length) {
        const box = document.getElementById('deps-unavailable');
        box.textContent = `Not fetched: ${D.depsUnavailable.join(' and ')}. The Dependencies counts below leave them out; they do not mean "none".`;
        box.style.display = '';
      }

      // ----- Header deployment summary (never a hardcoded "Live") -----
      {
        const envs = (D.deployments && D.deployments.envs) || [];
        const up = envs.filter(e => e.status === 'deployed');
        let summary;
        if (!D.deployments) summary = 'not fetched';
        else if (up.length) summary = up.map(e => e.n + (e.rev == null ? '' : ` r${e.rev}`)).join(' · ');
        else if (envs.length && envs.every(e => e.status === 'n/a')) summary = 'n/a (library)';
        else if (envs.length && envs.every(e => e.status === 'not-deployed')) summary = 'not deployed';
        else summary = 'unknown';
        document.getElementById('hdr-deployed').textContent = summary;
        if (up.length) document.getElementById('hdr-pulse').style.display = '';
      }

      // ----- Deployments (time-sensitive: shown with their "as of") -----
      if (D.deployments && (D.deployments.envs || []).length) {
        document.getElementById('deploy-wrap').style.display = '';
        document.getElementById('deploy-asof').textContent = `as of ${(D.deployments.fetchedAt || '').replace('T', ' ').replace('Z', ' UTC')}`;
        const block = document.getElementById('deploy-block');
        D.deployments.envs.forEach(e => {
          const row = el('div', null, 'ctx-row');
          row.appendChild(el('span', e.purpose || e.n, 'ctx-key')).title = e.n;
          let val;
          if (e.status === 'deployed') {
            const rev = e.rev == null ? 'revision unknown' : `r${e.rev}`;
            val = `${rev}${e.at ? ' · ' + e.at.slice(0, 10) : ''}${e.behind ? ` · ${e.behind} behind` : ''}`;
          } else if (e.status === 'not-deployed') {
            val = 'not deployed';
          } else if (e.status === 'n/a') {
            val = 'n/a';
          } else {
            val = 'unknown';
          }
          const v = row.appendChild(el('span', val, 'ctx-val'));
          if (e.reason) v.title = e.reason;
          block.appendChild(row);
        });
      }

      // ----- Stats -----
      // Action kinds as the Context Service reports them (actionTypeStr):
      // action = ServerAction, client = ClientAction, service = ServiceAction.
      // Bundles from builds before v1.5.0 carry kind 'function', which was a
      // mislabel of client actions — treat it as 'client'.
      const kindOf = a => a.kind === 'function' ? 'client' : (a.kind || 'action');
      const actCount     = D.actions.filter(a => kindOf(a) === 'action').length;
      const clientCount  = D.actions.filter(a => kindOf(a) === 'client').length;
      const serviceCount = D.actions.filter(a => kindOf(a) === 'service').length;
      document.getElementById('stat-flows').textContent      = D.uiFlows.length;
      document.getElementById('stat-screens').textContent    = D.screens.length;
      document.getElementById('stat-actions').textContent    = actCount;
      document.getElementById('stat-client').textContent     = clientCount;
      document.getElementById('stat-entities').textContent   = D.entities.length;
      document.getElementById('stat-enums').textContent      = D.enums.length;
      document.getElementById('stat-structures').textContent = D.structures.length;
      document.getElementById('stat-roles').textContent      = D.roles.length;

      // No graph library (offline, blocked CDN, or an integrity mismatch):
      // list the same data as plain HTML so the file is still useful.
      if (typeof vis === 'undefined') {
        renderFallback(D, kindOf);
        return;
      }

      // ----- Categories + colors -----
      const depAI       = (D.deps || []).filter(d => d.cat === 'AIModel');
      const depLib      = (D.deps || []).filter(d => d.cat === 'Library');
      const inheritedEn = D.inheritedEntities || [];
      const CATS = {
        Screen:    { label: 'Screens',           color: '#FF8DA0', count: D.screens.length },
        Action:    { label: 'Server Actions',    color: '#60A5FA', count: actCount },
        Client:    { label: 'Client Actions',    color: '#A78BFA', count: clientCount },
        Service:   { label: 'Service Actions',   color: '#F59E0B', count: serviceCount },
        Entity:    { label: 'Entities (owned)',  color: '#34D399', count: D.entities.length },
        InheritedEntity: { label: 'Entities (inh.)', color: '#6EE7B7', count: inheritedEn.length },
        Enum:      { label: 'Static Enums',      color: '#14B8A6', count: D.enums.length },
        InheritedEnum: { label: 'Enums (inh.)',  color: '#5EEAD4', count: (D.inheritedEnums || []).length },
        Structure: { label: 'Structures',        color: '#22D3EE', count: D.structures.length },
        Role:      { label: 'Roles',             color: '#FB923C', count: D.roles.length },
        AIModel:   { label: 'AI Models',         color: '#FF3D52', count: depAI.length },
        Library:   { label: 'Libraries',         color: '#F472B6', count: depLib.length },
      };

      const activeCats = new Set(Object.keys(CATS));

      // Sidebar filter UI
      const filterList = document.getElementById('filter-list');
      function filterRow(list, key, m, isOn, onToggle) {
        const row = document.createElement('label');
        row.className = 'filter-row' + (isOn ? '' : ' is-off');
        row.dataset.cat = key;
        const sw = el('span', null, 'filter-swatch'); sw.style.background = m.color;
        row.appendChild(sw);
        row.appendChild(el('span', m.label, 'filter-name'));
        row.appendChild(el('span', m.count, 'filter-count'));
        if (m.title) row.title = m.title;
        row.addEventListener('click', () => onToggle(row));
        list.appendChild(row);
      }
      Object.keys(CATS).forEach(c => {
        filterRow(filterList, c, CATS[c], true, row => {
          if (activeCats.has(c)) { activeCats.delete(c); row.classList.add('is-off'); }
          else { activeCats.add(c); row.classList.remove('is-off'); }
          applyFilters();
        });
      });

      // ----- Build graph -----
      const nodes = new vis.DataSet();
      const edges = new vis.DataSet();

      // App center
      nodes.add({
        id: 'app',
        label: app.name,
        title: `${app.name} (${app.type})`,
        color: { background: '#FFFFFF', border: '#FF3D52' },
        font: { color: '#0A0A0F', size: 18, face: 'Inter' },
        shape: 'dot', size: 38, borderWidth: 3,
        meta: { cat: 'App', type: app.type, name: app.name,
                desc: app.description || `${app.type} · rev ${app.revision}` }
      });

      // Layer hubs
      const LAYERS = [
        { id: 'layer-ui',    name: 'UI Layer',    color: '#FF8DA0' },
        { id: 'layer-logic', name: 'Logic Layer', color: '#60A5FA' },
        { id: 'layer-data',  name: 'Data Layer',  color: '#34D399' },
        { id: 'layer-sec',   name: 'Security',    color: '#FB923C' },
      ];
      // Dependencies layer is only added when there is something to show.
      if ((D.deps || []).length > 0) {
        LAYERS.push({ id: 'layer-deps', name: 'Dependencies', color: '#FF3D52' });
      }
      LAYERS.forEach(L => {
        nodes.add({
          id: L.id, label: L.name, title: `${L.name} hub`,
          color: { background: '#1F1F2A', border: L.color },
          font: { color: L.color, size: 14, face: 'Inter', bold: true },
          shape: 'box', shapeProperties: { borderRadius: 8 },
          borderWidth: 2, margin: 10,
          meta: { cat: 'Layer', type: 'Layer', name: L.name }
        });
        edges.add({ from: 'app', to: L.id, color: { color: '#4A4A5A', opacity: 0.7 }, width: 2.5 });
      });

      // ----- UI: flows → screens -----
      const flowName = {};
      D.uiFlows.forEach(f => {
        flowName[f.key] = f.name;
        nodes.add({
          id: `flow-${f.key}`, label: f.name, title: `UI Flow: ${f.name}`,
          color: { background: '#15151E', border: '#FBBF24' },
          font: { color: '#FBBF24', size: 12, face: 'Inter', bold: true },
          shape: 'box', shapeProperties: { borderRadius: 6 },
          borderWidth: 2, margin: 8,
          meta: { cat: 'UIFlow', type: 'UI Flow', name: f.name }
        });
        edges.add({ from: 'layer-ui', to: `flow-${f.key}`,
                    color: { color: '#FBBF24', opacity: 0.4 }, width: 1.5 });
      });
      D.screens.forEach(s => {
        nodes.add({
          id: s.k,
          label: s.n.length > 22 ? s.n.substring(0,20)+'…' : s.n,
          title: `${s.n}\n${s.desc || ''}`,
          color: { background: '#FF8DA022', border: '#FF8DA0' },
          font: { color: '#E8E8F0', size: 10, face: 'Inter' },
          shape: 'dot', size: 10, borderWidth: 1.5,
          meta: { cat: 'Screen', type: 'Screen', name: s.n, desc: s.desc, pub: s.pub, item: s }
        });
        const flowId = `flow-${s.flow}`;
        edges.add({ from: flowId, to: s.k,
                    color: { color: '#FF8DA0', opacity: 0.25 }, width: 0.7 });
      });

      // ----- Logic: actions grouped by kind (server / client / service) -----
      const ACTION_GROUPS = [
        { id: 'ag-action',  name: 'Server Actions',  kind: 'action',  cat: 'Action',  type: 'Server Action',  color: '#60A5FA', shape: 'dot',     size: 9 },
        { id: 'ag-client',  name: 'Client Actions',  kind: 'client',  cat: 'Client',  type: 'Client Action',  color: '#A78BFA', shape: 'diamond', size: 8 },
        { id: 'ag-service', name: 'Service Actions', kind: 'service', cat: 'Service', type: 'Service Action', color: '#F59E0B', shape: 'hexagon', size: 8 },
      ];
      const groupOf = a => ACTION_GROUPS.find(g => g.kind === kindOf(a)) || ACTION_GROUPS[0];
      ACTION_GROUPS.forEach(g => {
        const n = D.actions.filter(a => kindOf(a) === g.kind).length;
        if (n === 0) return;
        nodes.add({
          id: g.id, label: `${g.name}\n${n}`,
          color: { background: '#15151E', border: g.color },
          font: { color: g.color, size: 11, face: 'Inter', bold: true },
          shape: 'box', shapeProperties: { borderRadius: 6 },
          borderWidth: 2, margin: 6,
          meta: { cat: 'ActionGroup', type: g.name, name: `${g.name} (${n})` }
        });
        edges.add({ from: 'layer-logic', to: g.id,
                    color: { color: g.color, opacity: 0.4 }, width: 1.5 });
      });
      D.actions.forEach(a => {
        const g = groupOf(a);
        const color = g.color;
        nodes.add({
          id: a.k,
          label: a.n.length > 24 ? a.n.substring(0,22)+'…' : a.n,
          title: `${a.n}\n${a.desc || ''}`,
          color: { background: color + '22', border: color },
          font: { color: '#E8E8F0', size: 9.5, face: 'Inter' },
          shape: g.shape,
          size: g.size, borderWidth: 1.2,
          meta: { cat: g.cat, type: g.type, name: a.n, desc: a.desc, pub: a.pub, item: a }
        });
        edges.add({ from: g.id, to: a.k,
                    color: { color, opacity: 0.18 }, width: 0.5 });
      });

      // ----- Data: entities, inherited entities, enums, structures -----
      const DATA_HUBS = [
        { id: 'dh-ent',  name: 'Entities\n(owned)',     color: '#34D399', items: D.entities,        cat: 'Entity',          shape: 'square'   },
        { id: 'dh-ient', name: 'Entities\n(inherited)', color: '#6EE7B7', items: inheritedEn,       cat: 'InheritedEntity', shape: 'square'   },
        { id: 'dh-enu',  name: 'Enums',                 color: '#14B8A6', items: D.enums,           cat: 'Enum',            shape: 'triangle' },
        { id: 'dh-ienu', name: 'Enums\n(inherited)',    color: '#5EEAD4', items: D.inheritedEnums || [], cat: 'InheritedEnum', shape: 'triangle' },
        { id: 'dh-str',  name: 'Structures',            color: '#22D3EE', items: D.structures,      cat: 'Structure',       shape: 'dot'      },
      ];
      DATA_HUBS.forEach(h => {
        if (h.items.length === 0) return;
        nodes.add({
          id: h.id, label: `${h.name}\n${h.items.length}`,
          color: { background: '#15151E', border: h.color },
          font: { color: h.color, size: 12, face: 'Inter', bold: true },
          shape: 'box', shapeProperties: { borderRadius: 6 },
          borderWidth: 2, margin: 8,
          meta: { cat: 'DataHub', type: h.name, name: `${h.name} (${h.items.length})` }
        });
        edges.add({ from: 'layer-data', to: h.id,
                    color: { color: h.color, opacity: 0.4 }, width: 1.5 });
        h.items.forEach(it => {
          // For inherited entities, surface the source module in the tooltip
          // and prefix the visible label so reviewers immediately see the
          // attribution (e.g. "[EmployeeDir_DB] Employee" — solves the
          // "no owned entities" misleading-message field-test report).
          const isInh = h.cat === 'InheritedEntity' || h.cat === 'InheritedEnum';
          const tipExtra = isInh && it.fromModule ? `\nfrom: ${it.fromModule}` : '';
          // Node ids must be unique — inherited entities can share keys with
          // owned ones in odd edge cases. Prefix to be safe.
          const nodeId = isInh ? `inh:${it.k}` : it.k;
          nodes.add({
            id: nodeId,
            label: it.n.length > 22 ? it.n.substring(0,20)+'…' : it.n,
            title: `${it.n}\n${it.desc || ''}${tipExtra}`,
            color: { background: h.color + '22', border: h.color },
            font: { color: '#E8E8F0', size: 10, face: 'Inter' },
            shape: h.shape,
            size: (h.cat === 'Entity' || h.cat === 'InheritedEntity') ? 12 : (h.cat === 'Enum' ? 7 : 9),
            borderWidth: 1.4,
            meta: { cat: h.cat, type: h.cat, name: it.n,
                    desc: it.desc, fromModule: it.fromModule || null, item: it }
          });
          edges.add({ from: h.id, to: nodeId,
                      color: { color: h.color, opacity: 0.2 }, width: 0.6 });
        });
      });

      // ----- Security: roles -----
      D.roles.forEach(r => {
        nodes.add({
          id: r.k, label: r.n, title: `Role: ${r.n}`,
          color: { background: '#FB923C22', border: '#FB923C' },
          font: { color: '#E8E8F0', size: 11, face: 'Inter' },
          shape: 'star', size: 14, borderWidth: 1.5,
          meta: { cat: 'Role', type: 'Role', name: r.n, desc: r.desc, pub: r.pub, item: r }
        });
        edges.add({ from: 'layer-sec', to: r.k,
                    color: { color: '#FB923C', opacity: 0.5 }, width: 1.5 });
      });

      // ----- Dependencies: AI model connections + libraries -----
      // AI model connections come from context_connections, libraries from
      // app_refs (or the outsystems-dependency-impact cache).
      const DEP_GROUPS = [
        { id: 'dg-ai',  name: 'AI Models', cat: 'AIModel', color: '#FF3D52',
          items: depAI,  shape: 'hexagon' },
        { id: 'dg-lib', name: 'Libraries', cat: 'Library', color: '#F472B6',
          items: depLib, shape: 'dot' },
      ];
      DEP_GROUPS.forEach(g => {
        if (g.items.length === 0) return;
        nodes.add({
          id: g.id, label: `${g.name}\n${g.items.length}`,
          color: { background: '#15151E', border: g.color },
          font: { color: g.color, size: 12, face: 'Inter', bold: true },
          shape: 'box', shapeProperties: { borderRadius: 6 },
          borderWidth: 2, margin: 8,
          meta: { cat: 'DepHub', type: g.name, name: `${g.name} (${g.items.length})` }
        });
        edges.add({ from: 'layer-deps', to: g.id,
                    color: { color: g.color, opacity: 0.4 }, width: 1.5 });
        g.items.forEach(d => {
          // Prefix id so it can't collide with screen/action/entity keys
          const nodeId = `dep:${d.k || d.n}`;
          const title = `${d.n}\nkind: ${d.kind || '?'}${d.rev ? `\nrev: ${d.rev}` : ''}`;
          nodes.add({
            id: nodeId,
            label: d.n.length > 22 ? d.n.substring(0,20)+'…' : d.n,
            title,
            color: { background: g.color + '22', border: g.color },
            font: { color: '#E8E8F0', size: 10, face: 'Inter' },
            shape: g.shape, size: g.cat === 'AIModel' ? 13 : 10, borderWidth: 1.4,
            meta: { cat: g.cat, type: d.kind || g.name, name: d.n,
                    desc: d.rev ? `rev ${d.rev}` : '' }
          });
          edges.add({ from: g.id, to: nodeId,
                      color: { color: g.color, opacity: 0.3 }, width: 0.8 });
        });
      });

      // ----- Relationship edges (filterable; out of the physics layout) -----
      // FK: an owned entity's "<Entity> Identifier" attribute pointing at an
      // owned or inherited entity. Several attributes to the same target
      // share one edge. There are deliberately no screen → role edges: the
      // bundle carries no screen roles (the payload's list lacks the screen's
      // access mode, so it cannot say who may open a screen).
      const EDGE_CATS = {
        FK:     { label: 'Entity references (FK)', color: '#34D399', count: 0, on: true,
                  title: 'Owned entity → the entity an Identifier attribute points at' },
      };
      const fkPairs = {};
      D.entities.concat(D.enums).forEach(e => {
        (e.attrs || []).forEach(a => {
          const fk = a.fk;
          if (!fk || !fk.k || (fk.in !== 'owned' && fk.in !== 'inherited')) return;
          const to = fk.in === 'owned' ? fk.k : `inh:${fk.k}`;
          if (!nodes.get(to) || to === e.k) return;
          const id = `fk:${e.k}->${to}`;
          (fkPairs[id] = fkPairs[id] || { from: e.k, to, names: [], target: fk.n, src: e.n }).names.push(a.n);
        });
      });
      Object.keys(fkPairs).forEach(id => {
        const p = fkPairs[id];
        edges.add({ id, from: p.from, to: p.to, ecat: 'FK', physics: false,
                    arrows: { to: { enabled: true, scaleFactor: 0.5 } },
                    title: `${p.src}.${p.names.join(', ')} → ${p.target}`,
                    color: { color: '#34D399', opacity: 0.75 }, width: 1.3, dashes: false });
        EDGE_CATS.FK.count++;
      });
      const edgeList = document.getElementById('edge-filter-list');
      Object.keys(EDGE_CATS).forEach(c => {
        const m = EDGE_CATS[c];
        if (m.count === 0) return;
        filterRow(edgeList, c, m, m.on, row => {
          m.on = !m.on; row.classList.toggle('is-off', !m.on); applyEdgeFilters();
        });
      });
      function applyEdgeFilters() {
        const updates = [];
        edges.forEach(e => { if (e.ecat) updates.push({ id: e.id, hidden: !EDGE_CATS[e.ecat].on }); });
        edges.update(updates);
      }
      applyEdgeFilters();

      // ----- Render -----
      const container = document.getElementById('network');
      const options = {
        autoResize: true,
        nodes: { shadow: { enabled: true, color: 'rgba(0,0,0,0.55)', size: 8, x: 0, y: 2 } },
        edges: { smooth: { enabled: true, type: 'continuous', roundness: 0.4 } },
        physics: {
          enabled: true,
          solver: 'forceAtlas2Based',
          forceAtlas2Based: {
            gravitationalConstant: -65,
            centralGravity: 0.015,
            springLength: 130,
            springConstant: 0.09,
            damping: 0.55,
            avoidOverlap: 0.7
          },
          stabilization: { iterations: 260, updateInterval: 50 },
          timestep: 0.4
        },
        interaction: { hover: true, tooltipDelay: 200, zoomView: true, dragNodes: true }
      };
      const network = new vis.Network(container, { nodes, edges }, options);
      network.once('stabilizationIterationsDone', () => {
        network.setOptions({ physics: { enabled: false } });
        network.fit({ animation: { duration: 800, easingFunction: 'easeInOutCubic' } });
      });

      // Overlay (click a node for its detail)
      const overlay = document.getElementById('overlay');
      const ovTitle = document.getElementById('ov-title');
      const ovType  = document.getElementById('ov-type');
      const ovDesc  = document.getElementById('ov-desc');
      const ovDetail = document.getElementById('ov-detail');
      const CAT_COLOR = {
        App: '#FF3D52', Layer: '#9B9BA8', UIFlow: '#FBBF24',
        Screen: '#FF8DA0', Action: '#60A5FA', Client: '#A78BFA', Service: '#F59E0B',
        ActionGroup: '#60A5FA', DataHub: '#34D399',
        Entity: '#34D399', InheritedEntity: '#6EE7B7', Enum: '#14B8A6', InheritedEnum: '#5EEAD4', Structure: '#22D3EE',
        Role: '#FB923C', AIModel: '#FF3D52', Library: '#F472B6'
      };
      network.on('click', params => {
        if (!params.nodes.length) { overlay.classList.remove('is-visible'); return; }
        const n = nodes.get(params.nodes[0]);
        const m = n.meta || {};
        const c = CAT_COLOR[m.cat] || '#9B9BA8';
        ovTitle.textContent = '';
        const dot = el('span'); dot.style.cssText = `width:8px;height:8px;border-radius:50%;background:${c};display:inline-block;`;
        ovTitle.appendChild(dot);
        ovTitle.appendChild(document.createTextNode(m.name || n.label));
        ovType.textContent = m.type || '—';
        ovDesc.textContent = m.desc || '';
        ovDetail.textContent = '';
        renderDetail(ovDetail, m);
        overlay.classList.add('is-visible');
      });

      function section(parent, title) {
        const s = parent.appendChild(el('div', null, 'ov-section'));
        s.appendChild(el('div', title, 'ov-section-title'));
        return s;
      }
      function table(parent, rows) {
        const t = parent.appendChild(el('table', null, 'ov-table'));
        rows.forEach(cells => {
          const tr = t.appendChild(el('tr'));
          cells.forEach(cell => tr.appendChild(el('td', cell)));
        });
      }
      function attrRows(attrs) {
        return sortAttrs(attrs).map(a => {
          const tags = [a.pk ? 'PK' : '', a.req ? 'mandatory' : '', fkLabel(a.fk)].filter(Boolean).join(' · ');
          return [a.n, attrType(a) + (tags ? ` — ${tags}` : '')];
        });
      }
      function renderDetail(box, m) {
        const it = m.item || {};
        if (m.cat === 'App') {
          const revs = (D.revisions && D.revisions.rows) || [];
          if (revs.length) {
            const s = section(box, `Recent revisions (${revs.length} of ${D.revisions.total})`);
            table(s, revs.map(r => [`r${r.rev}`, `${(r.at || '').slice(0, 10)}${r.tag ? ' · ' + r.tag : ''}`]));
          }
          return;
        }
        if (m.cat === 'Screen') {
          if (it.title) section(box, 'Title').appendChild(el('div', it.title, 'ov-note'));
          if (flowName[it.flow]) section(box, 'UI flow').appendChild(el('div', flowName[it.flow], 'ov-note'));
          if ((it.inputs || []).length) table(section(box, 'Input parameters'), it.inputs.map(p => [p.n, `${p.t || '?'}${p.req ? ' — mandatory' : ''}`]));
          return;
        }
        if (m.cat === 'Action' || m.cat === 'Client' || m.cat === 'Service') {
          const ins = it.in || [], outs = it.out || [];
          if (ins.length) table(section(box, 'Inputs'), ins.map(p => [p.n, `${p.t || '?'}${p.req ? ' — mandatory' : ''}${p.d ? ' · ' + p.d : ''}`]));
          if (outs.length) table(section(box, 'Outputs'), outs.map(p => [p.n, `${p.t || '?'}${p.d ? ' · ' + p.d : ''}`]));
          if (!ins.length && !outs.length && it.in) section(box, 'Signature').appendChild(el('div', 'No parameters.', 'ov-note'));
          return;
        }
        if (['Entity', 'InheritedEntity', 'Enum', 'InheritedEnum', 'Structure'].includes(m.cat)) {
          if (m.fromModule) section(box, 'Defined in').appendChild(el('div', m.fromModule, 'ov-note'));
          if ((it.attrs || []).length) table(section(box, `Attributes (${it.attrs.length})`), attrRows(it.attrs));
          if (m.cat === 'Enum' || m.cat === 'InheritedEnum') {
            const s = section(box, 'Records');
            const recs = it.records || [];
            if (it.recordsTruncatedBytes != null) s.appendChild(el('div', `Not shown: the server truncated them (${it.recordsTruncatedBytes} bytes).`, 'ov-note'));
            else if (!recs.length) s.appendChild(el('div', 'None recorded by the Context Service.', 'ov-note'));
            else {
              s.appendChild(el('div', recs.slice(0, 20).join(', ')));
              const more = (it.recordCount || recs.length) - Math.min(recs.length, 20);
              if (more > 0) s.appendChild(el('div', `… and ${more} more`, 'ov-note'));
            }
          }
          return;
        }
      }

      // ----- Filtering -----
      const searchInput = document.getElementById('search');
      searchInput.addEventListener('input', applyFilters);
      document.getElementById('filter-reset').addEventListener('click', () => {
        activeCats.clear();
        Object.keys(CATS).forEach(c => activeCats.add(c));
        document.querySelectorAll('#filter-list .filter-row').forEach(r => r.classList.remove('is-off'));
        searchInput.value = '';
        applyFilters();
      });

      function isVisibleCat(cat) {
        if (['App', 'Layer', 'UIFlow'].includes(cat)) return true;
        if (cat === 'ActionGroup') return activeCats.has('Action') || activeCats.has('Client') || activeCats.has('Service');
        if (cat === 'DataHub') return activeCats.has('Entity') || activeCats.has('InheritedEntity') || activeCats.has('Enum') || activeCats.has('InheritedEnum') || activeCats.has('Structure');
        if (cat === 'DepHub') return activeCats.has('AIModel') || activeCats.has('Library');
        return activeCats.has(cat);
      }
      function applyFilters() {
        const q = (searchInput.value || '').trim().toLowerCase();
        const updates = [];
        nodes.forEach(n => {
          const m = n.meta || {};
          const cat = m.cat;
          const isScaffold = ['App', 'Layer', 'UIFlow', 'ActionGroup', 'DataHub', 'DepHub'].includes(cat);
          const matchesCat = isVisibleCat(cat);
          const matchesSearch = !q || isScaffold || (m.name || '').toLowerCase().includes(q);
          updates.push({ id: n.id, hidden: !(matchesCat && matchesSearch) });
        });
        nodes.update(updates);
      }

      // Zoom
      document.getElementById('zoom-fit').addEventListener('click', () =>
        network.fit({ animation: { duration: 600, easingFunction: 'easeInOutCubic' } }));
      document.getElementById('zoom-in').addEventListener('click', () => {
        const s = network.getScale(); network.moveTo({ scale: s * 1.25, animation: { duration: 200 } });
      });
      document.getElementById('zoom-out').addEventListener('click', () => {
        const s = network.getScale(); network.moveTo({ scale: s * 0.8, animation: { duration: 200 } });
      });
    }

    // ============================================================
    // Fallback: plain HTML listing when the graph library is missing
    // ============================================================
    function renderFallback(D, kindOf) {
      document.getElementById('filters-wrap').style.display = 'none';
      const wrap = document.querySelector('.graph-wrap');
      wrap.textContent = '';
      const box = wrap.appendChild(el('div', null, 'fallback'));
      box.id = 'fallback';
      box.appendChild(el('div',
        'The interactive graph could not load: its library (vis-network 9.1.9) comes from unpkg.com, ' +
        'with cdn.jsdelivr.net as the fallback; both are unreachable from here or served a file that ' +
        'failed the integrity check. ' +
        'The same data is listed below; open this file with internet access for the graph.',
        'fallback-banner'));
      function list(title, items, line) {
        if (!items.length) return;
        box.appendChild(el('h2', `${title} (${items.length})`));
        const ul = box.appendChild(el('ul'));
        items.slice().sort(byName).forEach(it => {
          const li = ul.appendChild(el('li'));
          li.appendChild(el('strong', it.n));
          const rest = line(it);
          if (rest) li.appendChild(document.createTextNode(' — ' + rest));
        });
      }
      const flows = {};
      D.uiFlows.forEach(f => { flows[f.key] = f.name; });
      list('Screens', D.screens, s => [flows[s.flow] ? `flow ${flows[s.flow]}` : '', s.desc || '',
        (s.inputs || []).length ? `inputs: ${s.inputs.map(paramText).join(', ')}` : ''].filter(Boolean).join(' · '));
      [['Server actions', 'action'], ['Client actions', 'client'], ['Service actions', 'service']].forEach(([t, k]) =>
        list(t, D.actions.filter(a => kindOf(a) === k), a => [
          (a.in || []).length ? `in: ${a.in.map(paramText).join(', ')}` : '',
          (a.out || []).length ? `out: ${a.out.map(paramText).join(', ')}` : '',
          a.desc || ''].filter(Boolean).join(' · ')));
      const attrsLine = e => sortAttrs(e.attrs).map(a => `${a.n}: ${a.t}${a.pk ? ' PK' : ''}${a.fk ? ' ' + fkLabel(a.fk) : ''}`).join(', ');
      list('Entities (owned)', D.entities, e => [attrsLine(e), e.desc || ''].filter(Boolean).join(' · '));
      list('Entities (inherited)', D.inheritedEntities || [], e => `from ${e.fromModule}`);
      list('Static entities', D.enums, e => e.recordsTruncatedBytes != null
        ? `records not shown: the server truncated them (${e.recordsTruncatedBytes} bytes)`
        : (e.records || []).slice(0, 20).join(', '));
      list('Static entities (inherited)', D.inheritedEnums || [], e => `from ${e.fromModule}`);
      list('Structures', D.structures, attrsLine);
      list('Roles', D.roles, r => r.desc || '');
      list('Dependencies', D.deps || [], d => `${d.cat === 'AIModel' ? 'AI model connection' : 'library'}${d.kind ? ' · ' + d.kind : ''}`);
    }
  </script>
</body>
</html>
