<!DOCTYPE html>
<!--
  template-version: 1.1.0
  Generated by the `outsystems-tenant-architecture` skill.
  Populate via `scripts/build.py <cache-dir> <output-path> ...`.
  Placeholders: /*__TENANT__*/, /*__ENVS__*/, /*__ASSETS__*/,
                /*__DEPLOYMENTS__*/, /*__HEALTH__*/ (the last two may stay null)

  Network use: the tenant data is embedded in this file, but the graph
  library (vis-network 9.1.9, pinned by Subresource Integrity, unpkg with a
  jsDelivr fallback) and the web fonts load from public CDNs. Without them
  the page falls back to the asset table and system fonts.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OutSystems Tenant Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking: a blocked or offline font host must not hold up the page;
       every font-family below has a system fallback. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <script id="vis-lib" async
          src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"
          integrity="sha384-yxKDWWf0wwdUj/gPeuL11czrnKFQROnLgY8ll7En9NYoXibgg3C6NK/UDHNtUgWJ"
          crossorigin="anonymous"
          onload="window.__visState='ok'" onerror="window.__visState='error'"></script>
  <style>
    :root {
      --os-bg: #0A0A0F;
      --os-bg-2: #11111A;
      --os-card: #161620;
      --os-card-2: #1C1C28;
      --os-border: #262633;
      --os-border-strong: #353548;
      --os-text: #F5F5F7;
      --os-text-muted: #9B9BA8;
      --os-text-dim: #6B6B7A;
      --os-red: #FF3D52;
      --os-red-dark: #C42030;
      --os-red-glow: rgba(255, 61, 82, 0.18);

      --c-web: #FF3D52;
      --c-mobile: #FF8DA0;
      --c-agent: #B57BFF;
      --c-aimodel: #E94EAB;
      --c-workflow: #34D399;
      --c-lowcode: #3B82F6;
      --c-extension: #22D3EE;
      --c-mobilelib: #14B8A6;
      --c-externallib: #A3E635;
      --c-widget: #FBBF24;
      --c-extconn: #FB923C;
      --c-tenant: #FFFFFF;
      --c-env-dev: #60A5FA;
      --c-env-test: #FBBF24;
      --c-env-prod: #34D399;
      --c-unknown: #6B6B7A;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--os-bg);
      color: var(--os-text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      letter-spacing: -0.01em;
      overflow: hidden;
    }
    .app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }

    /* Empty state — shown when placeholders aren't populated */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 16px; padding: 40px;
      text-align: center;
    }
    .empty-state .mark {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--os-red) 0%, var(--os-red-dark) 100%);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: white; font-size: 28px;
      box-shadow: 0 10px 40px var(--os-red-glow);
    }
    .empty-state h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
    .empty-state p { color: var(--os-text-muted); max-width: 500px; line-height: 1.55; font-size: 14px; }
    .empty-state code {
      background: var(--os-card); padding: 2px 8px; border-radius: 5px;
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px;
      border: 1px solid var(--os-border); color: var(--os-text);
    }

    /* Header */
    header.topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px;
      background: linear-gradient(180deg, #0E0E16 0%, #0A0A0F 100%);
      border-bottom: 1px solid var(--os-border);
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--os-red) 0%, var(--os-red-dark) 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px var(--os-red-glow);
      font-weight: 800; color: white; font-size: 18px;
    }
    .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .brand-sub { font-size: 12px; color: var(--os-text-muted); margin-top: 2px; }
    .header-meta { display: flex; gap: 22px; align-items: center; }
    .meta-item { display: flex; flex-direction: column; }
    .meta-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--os-text-dim); font-weight: 600;
    }
    .meta-value { font-size: 13px; color: var(--os-text); font-weight: 500; margin-top: 3px; }
    .meta-value.pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--os-card-2); border: 1px solid var(--os-border);
      padding: 3px 10px; border-radius: 999px;
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px;
    }
    .pulse {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--c-workflow);
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6); }
      70% { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      padding: 16px 28px;
      background: var(--os-bg);
      border-bottom: 1px solid var(--os-border);
    }
    .stat {
      background: linear-gradient(180deg, var(--os-card) 0%, var(--os-card-2) 100%);
      border: 1px solid var(--os-border);
      border-radius: 12px;
      padding: 14px 16px;
      position: relative; overflow: hidden;
    }
    .stat::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent, var(--os-red));
    }
    .stat-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--os-text-muted); font-weight: 600;
    }
    .stat-value {
      font-size: 26px; font-weight: 700; color: var(--os-text);
      margin-top: 4px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
    }
    .stat-detail { font-size: 11px; color: var(--os-text-dim); margin-top: 2px; }

    /* Main */
    main {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100%;
      overflow: hidden;
    }
    aside.sidebar {
      background: var(--os-bg-2);
      border-right: 1px solid var(--os-border);
      padding: 18px 18px;
      overflow-y: auto;
    }
    .panel-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--os-text-muted); font-weight: 600;
      margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-title button {
      background: none; border: none; color: var(--os-red);
      font-size: 10px; letter-spacing: 0.08em; cursor: pointer; font-weight: 600;
    }
    .panel-title button:hover { color: #ff7184; }

    .search {
      width: 100%;
      background: var(--os-card); border: 1px solid var(--os-border);
      border-radius: 8px; color: var(--os-text);
      padding: 8px 12px; font-size: 13px; font-family: inherit;
      margin-bottom: 18px; outline: none;
    }
    .search:focus { border-color: var(--os-red); box-shadow: 0 0 0 3px var(--os-red-glow); }

    .filter-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 22px; }
    .filter-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 8px; border-radius: 7px;
      cursor: pointer; user-select: none;
      transition: background 120ms;
    }
    .filter-row:hover { background: var(--os-card); }
    .filter-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .filter-row .filter-name { flex: 1; font-size: 13px; color: var(--os-text); }
    .filter-row.is-off .filter-name { color: var(--os-text-dim); text-decoration: line-through; opacity: 0.6; }
    .filter-row.is-off .filter-swatch { opacity: 0.35; }
    .filter-count {
      font-size: 11px; color: var(--os-text-muted);
      font-variant-numeric: tabular-nums;
      background: var(--os-card); padding: 2px 7px; border-radius: 999px;
      border: 1px solid var(--os-border);
    }
    .filter-row.is-off .filter-count { opacity: 0.4; }

    .ctx-block {
      background: var(--os-card); border: 1px solid var(--os-border);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
    }
    .ctx-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px; gap: 12px; }
    .ctx-row + .ctx-row { border-top: 1px solid var(--os-border); }
    .ctx-key { color: var(--os-text-muted); }
    .ctx-val { color: var(--os-text); font-weight: 500; }

    .legend-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: var(--os-text-muted);
      margin-bottom: 5px;
    }
    .legend-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--c-tenant);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
    }
    .legend-dot.env { background: var(--c-env-dev); box-shadow: none; }
    .legend-dot.hub { background: var(--os-text-muted); box-shadow: none; }

    /* Graph */
    .graph-wrap {
      position: relative;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 61, 82, 0.04) 0%, transparent 60%),
        var(--os-bg);
      overflow: hidden;
    }
    #network { width: 100%; height: 100%; }
    .graph-overlay {
      position: absolute; top: 16px; right: 16px;
      background: rgba(15, 15, 22, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--os-border);
      border-radius: 10px;
      padding: 12px 14px;
      max-width: 280px;
      pointer-events: none;
      opacity: 0; transition: opacity 150ms;
    }
    .graph-overlay.is-visible { opacity: 1; }
    .overlay-title {
      font-size: 13px; font-weight: 600; color: var(--os-text);
      margin-bottom: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .overlay-type {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--os-text-dim); margin-bottom: 8px;
    }
    .overlay-row { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; gap: 12px; }
    .overlay-row .k { color: var(--os-text-muted); }
    .overlay-row .v { color: var(--os-text); font-family: 'JetBrains Mono', ui-monospace, monospace; }

    .legend-floating {
      position: absolute; bottom: 16px; left: 16px;
      background: rgba(15, 15, 22, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid var(--os-border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 11px; color: var(--os-text-muted);
      display: flex; gap: 16px; align-items: center;
    }
    .legend-floating > div { display: flex; align-items: center; gap: 6px; }

    .graph-controls {
      position: absolute; bottom: 16px; right: 16px;
      display: flex; gap: 8px;
    }
    .ctrl-btn {
      background: rgba(15, 15, 22, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--os-border);
      color: var(--os-text);
      width: 36px; height: 36px; border-radius: 8px;
      cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: all 120ms;
    }
    .ctrl-btn:hover { border-color: var(--os-red); color: var(--os-red); }

    aside.sidebar::-webkit-scrollbar { width: 6px; }
    aside.sidebar::-webkit-scrollbar-track { background: transparent; }
    aside.sidebar::-webkit-scrollbar-thumb { background: var(--os-border-strong); border-radius: 3px; }

    [hidden] { display: none !important; }
    /* Stats: one tile per group; "Other" appears only when unknown types exist */
    .stats { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .stat-detail { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Single-choice filter rows (deployments, health) */
    .filter-row.radio .filter-swatch { border-radius: 50%; }
    .filter-row.radio.is-selected { background: var(--os-card-2); box-shadow: inset 2px 0 0 var(--os-red); }
    .badge {
      font-size: 9px; letter-spacing: 0.08em; font-weight: 700; text-transform: uppercase;
      padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor;
      color: var(--c-env-test); white-space: nowrap;
    }
    .badge.off { color: var(--os-text-dim); }
    .panel-note { font-size: 11px; line-height: 1.5; color: var(--os-text-dim); margin: -14px 0 22px; }
    .panel-note b { color: var(--os-text-muted); font-weight: 600; }

    /* View toggle + library fallback banner */
    .view-toggle {
      position: absolute; top: 16px; left: 16px; z-index: 2;
      display: flex; background: rgba(15, 15, 22, 0.85); border: 1px solid var(--os-border);
      border-radius: 8px; overflow: hidden;
    }
    .view-toggle button {
      background: none; border: none; color: var(--os-text-muted); font: inherit; font-size: 12px;
      padding: 6px 12px; cursor: pointer;
    }
    .view-toggle button.is-on { background: var(--os-card-2); color: var(--os-text); }
    .view-toggle button:disabled { opacity: 0.35; cursor: not-allowed; }
    .banner {
      position: absolute; top: 60px; left: 16px; right: 16px; z-index: 2;
      background: #2A1A10; border: 1px solid #7C4A1E; color: #FCD9B6;
      border-radius: 8px; padding: 10px 14px; font-size: 12px; line-height: 1.5;
    }
    .graph-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--os-text-dim); font-size: 13px; pointer-events: none;
    }

    /* Asset table (always available; the only view when the graph library cannot load) */
    .table-view { position: absolute; inset: 0; overflow: auto; padding: 60px 16px 16px; }
    .table-view.with-banner { padding-top: 120px; }
    /* The detail panel floats top-right: keep the table's last columns clear of it. */
    .graph-wrap.has-detail .table-view { padding-right: 360px; }
    .asset-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .asset-table th {
      position: sticky; top: 0; background: var(--os-bg-2); text-align: left;
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--os-text-muted);
      padding: 8px 10px; border-bottom: 1px solid var(--os-border); font-weight: 600;
    }
    .asset-table td { padding: 6px 10px; border-bottom: 1px solid var(--os-border); vertical-align: top; }
    .asset-table tr { cursor: pointer; }
    .ai-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 0 0 18px; }
    .ai-card { background: var(--os-card); border: 1px solid var(--os-border); border-radius: 8px; padding: 10px 12px; }
    .ai-card .n { font-size: 20px; font-weight: 700; }
    .ai-card .l { font-size: 11px; color: var(--os-text-dim); }
    .ai-view h3 { font-size: 13px; margin: 18px 0 8px; }
    .flag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-right: 4px;
            background: var(--os-card-2); border: 1px solid var(--os-border); }
    .asset-table tbody tr:hover { background: var(--os-card); }
    .asset-table .dim { color: var(--os-text-dim); }
    .asset-table .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

    /* Detail panel sections */
    .graph-overlay { max-width: 340px; max-height: calc(100% - 100px); overflow-y: auto; z-index: 3; }
    .graph-overlay.is-visible { pointer-events: auto; }
    .overlay-close {
      position: absolute; top: 6px; right: 8px; background: none; border: none;
      color: var(--os-text-dim); font-size: 16px; cursor: pointer;
    }
    .overlay-section {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--os-text-dim); margin: 10px 0 4px; padding-top: 8px; border-top: 1px solid var(--os-border);
    }
    .overlay-note { font-size: 11px; color: var(--os-text-muted); line-height: 1.45; padding: 2px 0; }
    .overlay-row .v a { color: #7FB4FF; text-decoration: none; }
    .overlay-row .v.na { color: var(--os-text-dim); font-style: italic; font-family: inherit; }
    .drift { color: var(--c-env-test); }
  </style>
</head>
<body>
  <div id="app-root">
    <!-- Populated by JS at boot -->
  </div>

  <template id="tpl-app">
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">O</div>
          <div>
            <div class="brand-name">Tenant Architecture</div>
            <div class="brand-sub">OutSystems Developer Cloud · Enterprise Context</div>
          </div>
        </div>
        <div class="header-meta">
          <div class="meta-item">
            <span class="meta-label">Tenant</span>
            <span class="meta-value pill" id="hdr-tenant">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Region</span>
            <span class="meta-value" id="hdr-region">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Environments</span>
            <span class="meta-value" id="hdr-envs">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Snapshot</span>
            <span class="meta-value" id="hdr-snapshot">—</span>
          </div>
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <main>
        <aside class="sidebar">
          <div class="panel-title"><span>Enterprise Context</span></div>
          <div class="ctx-block" id="ctx-block">
            <div class="ctx-row"><span class="ctx-key">Tenant ID</span><span class="ctx-val" id="ctx-id" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;">—</span></div>
            <div class="ctx-row"><span class="ctx-key">Hostname</span><span class="ctx-val" id="ctx-hostname" style="font-size:11px;">—</span></div>
            <div class="ctx-row"><span class="ctx-key">Hosting</span><span class="ctx-val" id="ctx-hosting">—</span></div>
            <div class="ctx-row"><span class="ctx-key">Region</span><span class="ctx-val" id="ctx-region">—</span></div>
            <div class="ctx-row"><span class="ctx-key">Realm</span><span class="ctx-val" id="ctx-realm">—</span></div>
            <div class="ctx-row"><span class="ctx-key">Environments</span><span class="ctx-val" id="ctx-envs">—</span></div>
          </div>

          <div class="panel-title"><span>Data As Of</span></div>
          <div class="ctx-block">
            <div class="ctx-row"><span class="ctx-key">Assets</span><span class="ctx-val" id="fresh-assets">—</span></div>
            <div class="ctx-row"><span class="ctx-key">Deployments</span><span class="ctx-val" id="fresh-deploy">—</span></div>
            <div class="ctx-row"><span class="ctx-key">Health window</span><span class="ctx-val" id="fresh-health">—</span></div>
            <div class="ctx-row"><span class="ctx-key">AI governance</span><span class="ctx-val" id="fresh-ai">—</span></div>
          </div>
          <div style="height:10px"></div>

          <div class="panel-title">
            <span>Filter by Asset Type</span>
            <button id="filter-reset">RESET</button>
          </div>
          <input class="search" id="search" type="text" placeholder="Search assets…" />
          <div class="filter-list" id="filter-list"></div>

          <div class="panel-title"><span>Deployments</span></div>
          <div class="filter-list" id="deploy-list"></div>
          <div class="panel-note" id="deploy-note"></div>

          <div class="panel-title"><span id="health-title">Health</span></div>
          <div class="filter-list" id="health-list"></div>
          <div class="panel-note" id="health-note"></div>

          <div class="panel-title"><span>AI Governance</span></div>
          <div class="filter-list" id="ai-list"></div>
          <div class="panel-note" id="ai-note"></div>

          <div class="panel-title"><span>Graph Legend</span></div>
          <div>
            <div class="legend-item"><span class="legend-dot" style="background:#fff"></span>Tenant root</div>
            <div class="legend-item"><span class="legend-dot env"></span>Environment (edges to assets drawn for the selected environment only)</div>
            <div class="legend-item"><span class="legend-dot hub"></span>Category hub</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--c-web)"></span>Asset (colored by type)</div>
            <div class="legend-item"><span class="legend-dot" style="background:transparent;border:1px dashed var(--c-env-test);box-shadow:none"></span>Dashed border: revision drift</div>
          </div>
        </aside>

        <div class="graph-wrap">
          <div class="view-toggle">
            <button id="view-graph" class="is-on">Graph</button>
            <button id="view-table">Table</button>
            <button id="view-ai">AI governance</button>
          </div>
          <div class="banner" id="banner" hidden></div>
          <div id="network"><div class="graph-loading" id="graph-loading">Loading graph library…</div></div>
          <div class="table-view" id="table-view" hidden></div>
          <div class="table-view ai-view" id="ai-view" hidden></div>
          <div class="graph-overlay" id="overlay">
            <button class="overlay-close" id="ov-close" title="Close">×</button>
            <div id="ov-body"></div>
          </div>
          <div class="legend-floating" id="legend-floating">
            <div><span class="legend-dot" style="background:#fff"></span>Tenant</div>
            <div><span class="legend-dot env"></span>Env</div>
            <div><span class="legend-dot hub"></span>Hub</div>
            <div style="color:var(--os-text-dim);font-size:10px;">Scroll · Drag · Click for details</div>
          </div>
          <div class="graph-controls" id="graph-controls">
            <button class="ctrl-btn" id="zoom-fit" title="Fit graph">⤢</button>
            <button class="ctrl-btn" id="zoom-in" title="Zoom in">+</button>
            <button class="ctrl-btn" id="zoom-out" title="Zoom out">−</button>
          </div>
        </div>
      </main>
    </div>
  </template>

  <template id="tpl-empty">
    <div class="empty-state">
      <div class="mark">O</div>
      <h1>Template not yet populated</h1>
      <p>
        This is the bare <code>template.html</code> shipped with the
        <code>outsystems-tenant-architecture</code> skill. Run the skill
        through your agent (or invoke <code>scripts/build.py</code> directly)
        to populate it with your tenant data.
      </p>
      <p style="font-size: 12px;">
        Expected placeholders: <code>/*__TENANT__*/</code>,
        <code>/*__ENVS__*/</code>, <code>/*__ASSETS__*/</code>
        (plus the optional <code>/*__DEPLOYMENTS__*/</code>, <code>/*__HEALTH__*/</code>).
      </p>
    </div>
  </template>

  <script>
    // ============================================================
    // Data — populated by build.py from cached MCP responses.
    // Do not edit by hand. DEPLOYMENTS and HEALTH may be null
    // (overlay not fetched); every view below copes with that.
    // ============================================================
    const TENANT       = /*__TENANT__*/null;
    const ENVIRONMENTS = /*__ENVS__*/null;
    const ASSETS       = /*__ASSETS__*/null;
    const DEPLOYMENTS  = /*__DEPLOYMENTS__*/null;
    const HEALTH       = /*__HEALTH__*/null;
    const AI           = /*__AI__*/null;

    // Same file, same hash as the <script id="vis-lib"> tag; tried when
    // unpkg fails or is blocked.
    const VIS_SRI      = "sha384-yxKDWWf0wwdUj/gPeuL11czrnKFQROnLgY8ll7En9NYoXibgg3C6NK/UDHNtUgWJ";
    const VIS_FALLBACK = "https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js";
    // Canvas text has no CSS cascade, so the fallback stack is spelled out.
    const FONT = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";

    // ============================================================
    // Boot
    // ============================================================
    const root = document.getElementById('app-root');

    if (!TENANT || !Array.isArray(ENVIRONMENTS) || !Array.isArray(ASSETS)) {
      root.appendChild(document.getElementById('tpl-empty').content.cloneNode(true));
    } else {
      root.appendChild(document.getElementById('tpl-app').content.cloneNode(true));
      const ui = boot();
      loadVis().then(ok => ok ? ui.renderGraph() : ui.graphUnavailable());
    }

    // Resolves true once `window.vis` exists: the pinned unpkg copy, else the
    // same pinned file from jsDelivr, else false (offline / both blocked).
    function loadVis() {
      return new Promise(resolve => {
        let settled = false, fellBack = false;
        const done = () => { if (!settled) { settled = true; resolve(!!window.vis); } };
        const fallback = () => {
          if (window.vis) return done();
          if (fellBack) return;
          fellBack = true;
          const s = document.createElement('script');
          s.src = VIS_FALLBACK; s.integrity = VIS_SRI; s.crossOrigin = 'anonymous';
          s.onload = done; s.onerror = done;
          document.head.appendChild(s);
          setTimeout(done, 10000);
        };
        if (window.vis) return done();
        if (window.__visState === 'error') return fallback();
        const tag = document.getElementById('vis-lib');
        tag.addEventListener('load', () => window.vis ? done() : fallback());
        tag.addEventListener('error', fallback);
        setTimeout(() => window.vis ? done() : fallback(), 8000);
      });
    }

    function boot() {
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      // ----- Asset type catalog -----
      // One entry per app_list `assetType` seen on real tenants. Labels are
      // the server's type names spelled out; no semantics beyond that are
      // implied (e.g. Agent and AgentDefinition are separate catalogue
      // types and are counted separately). Mirrored by ASSET_TYPE_HUBS in
      // scripts/build.py.
      const TYPES = {
        WebApplication:          { label: "Web Application",          color: "#FF3D52", hub: "Applications", tile: "apps" },
        MobileApplication:       { label: "Mobile Application",       color: "#FF8DA0", hub: "Applications", tile: "apps" },
        Workflow:                { label: "Workflow",                 color: "#34D399", hub: "Applications", tile: "apps" },
        Agent:                   { label: "Agent",                    color: "#B57BFF", hub: "AI", tile: "agents" },
        AgentDefinition:         { label: "Agent Definition",         color: "#7C3AED", hub: "AI", tile: "agents" },
        AIModelConnection:       { label: "AI Model Connection",      color: "#E94EAB", hub: "AI", tile: "ai" },
        KnowledgeBase:           { label: "Knowledge Base",           color: "#F0ABFC", hub: "AI", tile: "ai" },
        AINativeConnection:      { label: "AI-Native Connection",     color: "#818CF8", hub: "AI", tile: "ai" },
        LowCodeLibrary:          { label: "Low-Code Library",         color: "#3B82F6", hub: "Libraries", tile: "libs" },
        ExtensionLibrary:        { label: "Extension Library",        color: "#22D3EE", hub: "Libraries", tile: "libs" },
        MobileLibrary:           { label: "Mobile Library",           color: "#14B8A6", hub: "Libraries", tile: "libs" },
        ExternalLibrary:         { label: "External Library",         color: "#A3E635", hub: "Libraries", tile: "libs" },
        WidgetLibrary:           { label: "Widget Library",           color: "#FBBF24", hub: "Libraries", tile: "libs" },
        ExternalConnection:      { label: "External Connection",      color: "#FB923C", hub: "Integrations", tile: "conn" },
        MCPConnection:           { label: "MCP Connection",           color: "#FED7AA", hub: "Integrations", tile: "conn" },
        SearchServiceConnection: { label: "Search Service Connection", color: "#C2410C", hub: "Integrations", tile: "conn" },
        A2AConnection:           { label: "A2A Connection",           color: "#FDE68A", hub: "Integrations", tile: "conn" }
      };
      const HUBS = ["Applications", "AI", "Libraries", "Integrations", "Other"];
      const TILES = [
        { id: "apps",   label: "Applications", accent: "#FF3D52" },
        { id: "agents", label: "Agents",       accent: "#B57BFF" },
        { id: "ai",     label: "AI Resources", accent: "#E94EAB" },
        { id: "libs",   label: "Libraries",    accent: "#3B82F6" },
        { id: "conn",   label: "Integrations", accent: "#FB923C" },
        { id: "other",  label: "Other",        accent: "#6B6B7A" }
      ];

      // Types this template does not know render grey under their own
      // "Other" hub and tile, never silently inside a real category.
      function typeMeta(t) {
        return TYPES[t] || { label: t || "Unknown type", color: "#6B6B7A", hub: "Other", tile: "other" };
      }

      const envByKey = {};
      ENVIRONMENTS.forEach(e => { envByKey[e.key] = e; });
      const envColors = { Development: '#60A5FA', NonProduction: '#FBBF24', Production: '#34D399' };
      const envColor = e => envColors[(e || {}).purpose] || '#60A5FA';
      const envName = key => (envByKey[key] || {}).name || key;

      const depOf = k => (DEPLOYMENTS && DEPLOYMENTS.assets && DEPLOYMENTS.assets[k]) || [];
      const driftOf = k => (DEPLOYMENTS && DEPLOYMENTS.drift && DEPLOYMENTS.drift[k]) || null;
      const depStatus = key => (DEPLOYMENTS && DEPLOYMENTS.envs && DEPLOYMENTS.envs[key]) || null;
      const listedTypes = new Set((DEPLOYMENTS && DEPLOYMENTS.listedTypes) || []);
      const depIncomplete = DEPLOYMENTS
        ? ENVIRONMENTS.filter(e => (depStatus(e.key) || {}).status !== 'complete') : [];
      // Deployed assets that app_list does not list: no node, no table row of
      // their own kind, so they get a section of the table instead.
      const depUnlisted = (DEPLOYMENTS && DEPLOYMENTS.unlisted) || [];
      const unlistedIn = key => depUnlisted.filter(u => u.deps.some(d => d.env === key));
      const healthOf = k => (HEALTH && HEALTH.assets && HEALTH.assets[k]) || null;
      const healthEnvs = (HEALTH && HEALTH.envs) || {};
      const winLabel = HEALTH && HEALTH.hours
        ? (HEALTH.hours % 24 === 0 ? `${HEALTH.hours / 24}d` : `${HEALTH.hours}h`) : 'window';

      // AI governance: context_agents (Agent apps) + context_connections (AI
      // model connections), joined to assets by key. Other AI-ish types are
      // shown as "not reported by the governance source".
      const aiOn = !!(AI && AI.status === 'complete');
      const aiByKey = {};
      if (aiOn) {
        AI.agents.forEach(r => { aiByKey[r.k] = Object.assign({ kind: 'agent' }, r); });
        AI.connections.forEach(r => { aiByKey[r.k] = Object.assign({ kind: 'connection' }, r); });
      }
      const aiOf = k => aiByKey[k] || null;
      const AI_UNCOVERED_TYPES = new Set(['AgentDefinition', 'KnowledgeBase', 'AINativeConnection', 'MCPConnection', 'SearchServiceConnection', 'A2AConnection']);
      const aiCoveredTypes = new Set((AI && AI.coveredTypes) || []);
      const isAiType = t => aiCoveredTypes.has(t) || AI_UNCOVERED_TYPES.has(t);

      const fmtTs = ts => ts ? new Date(ts * 1000).toISOString().slice(0, 16).replace('T', ' ') + ' UTC' : '—';
      const fmtIso = s => s ? String(s).slice(0, 16).replace('T', ' ') : '—';

      // ----- Header + sidebar context -----
      const tenantPrefix = (TENANT.id || "").slice(0, 8);
      const hosting = TENANT.hosting === "oscloud" ? "OS Cloud" : (TENANT.hosting || "—");
      document.getElementById('hdr-tenant').textContent = `${tenantPrefix} · ${TENANT.realm || "tenant"}`;
      document.getElementById('hdr-region').textContent = `${TENANT.region || "—"} · ${hosting}`;
      document.getElementById('hdr-envs').textContent   = `${ENVIRONMENTS.length} environment${ENVIRONMENTS.length === 1 ? "" : "s"}`;
      document.getElementById('hdr-snapshot').textContent = fmtTs(TENANT.fetched_at);

      document.getElementById('ctx-id').textContent       = `${tenantPrefix}…${(TENANT.id || "").slice(-5)}`;
      document.getElementById('ctx-hostname').textContent = TENANT.hostname || "—";
      document.getElementById('ctx-hosting').textContent  = hosting;
      document.getElementById('ctx-region').textContent   = TENANT.region || "—";
      document.getElementById('ctx-realm').textContent    = TENANT.realm || "—";
      document.getElementById('ctx-envs').textContent     = `${ENVIRONMENTS.length} (${ENVIRONMENTS.map(e => e.name).join(" · ")})`;
      document.title = `${TENANT.realm || "Tenant"} — OutSystems Architecture`;

      document.getElementById('fresh-assets').textContent = fmtTs(TENANT.fetched_at);
      document.getElementById('fresh-deploy').textContent = DEPLOYMENTS ? fmtTs(DEPLOYMENTS.fetched_at) : 'not fetched';
      document.getElementById('fresh-health').textContent = !HEALTH ? 'not fetched'
        : HEALTH.skipped ? 'skipped'
        : HEALTH.since ? `${fmtIso(HEALTH.since)} → ${fmtIso(HEALTH.to)}` : 'no reading';
      document.getElementById('fresh-ai').textContent = !AI ? 'not fetched'
        : AI.status === 'skipped' ? 'skipped' : fmtTs(AI.fetched_at);

      // ----- Counts + stat tiles (tiles sum to the total) -----
      const counts = {};
      ASSETS.forEach(a => { counts[a.t] = (counts[a.t] || 0) + 1; });
      const presentTypes = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

      const tile = (label, value, detail, accent) => `
        <div class="stat" style="--accent: ${accent}">
          <div class="stat-label">${esc(label)}</div>
          <div class="stat-value">${esc(value)}</div>
          <div class="stat-detail" title="${esc(detail)}">${esc(detail)}</div>
        </div>`;
      document.getElementById('stats').innerHTML =
        tile('Total Assets', ASSETS.length.toLocaleString(), 'Tenant catalogue (app_list)', '#FFFFFF') +
        TILES.map(t => {
          const types = presentTypes.filter(x => typeMeta(x).tile === t.id);
          if (t.id === 'other' && !types.length) return '';
          const n = types.reduce((s, x) => s + counts[x], 0);
          const detail = types.length ? types.map(x => `${typeMeta(x).label} ${counts[x]}`).join(' · ') : 'None in this tenant';
          return tile(t.label, n.toLocaleString(), detail, t.accent);
        }).join('');

      // ----- Filter state -----
      const activeTypes = new Set(presentTypes);
      let envFilter = 'all';     // 'all' | <env key> | 'drift' | 'none'
      let healthFilter = 'all';  // 'all' | 'errors' | 'noTraffic' | 'noReading'
      let aiFilter = 'all';      // 'all' | 'p:<provider>' | 'e:<entitlement>' | 'testDemo' | 'stale' | 'public' | 'uncovered'
      const searchInput = document.getElementById('search');

      function matchesEnv(a) {
        if (envFilter === 'all') return true;
        if (envFilter === 'none') return listedTypes.has(a.t) && depOf(a.k).length === 0;
        if (envFilter === 'drift') return !!driftOf(a.k);
        return depOf(a.k).some(d => d.env === envFilter);
      }
      function matchesHealth(a) {
        if (healthFilter === 'all') return true;
        const h = healthOf(a.k);
        return !!h && h.cls === healthFilter;
      }
      function matchesAi(a) {
        if (aiFilter === 'all') return true;
        const r = aiOf(a.k);
        if (aiFilter === 'uncovered') return isAiType(a.t) && !r;
        if (!r) return false;
        if (aiFilter.startsWith('p:')) return r.kind === 'connection' && r.provider === aiFilter.slice(2);
        if (aiFilter.startsWith('e:')) return r.kind === 'connection' && r.entitlement === aiFilter.slice(2);
        if (aiFilter === 'testDemo') return r.kind === 'agent' && r.testDemo;
        if (aiFilter === 'stale') return r.kind === 'agent' && r.stale;
        if (aiFilter === 'public') return r.kind === 'agent' && r.pub;
        return true;
      }
      function isVisible(a) {
        const q = (searchInput.value || '').trim().toLowerCase();
        return activeTypes.has(a.t) && (!q || (a.n || '').toLowerCase().includes(q))
          && matchesEnv(a) && matchesHealth(a) && matchesAi(a);
      }

      // ----- Type filter UI -----
      const filterList = document.getElementById('filter-list');
      presentTypes.forEach(t => {
        const m = typeMeta(t);
        const row = document.createElement('label');
        row.className = 'filter-row';
        row.dataset.type = t;
        row.innerHTML = `
          <span class="filter-swatch" style="background:${m.color}"></span>
          <span class="filter-name">${esc(m.label)}${TYPES[t] ? '' : ' <span class="badge off">other</span>'}</span>
          <span class="filter-count">${counts[t] || 0}</span>
        `;
        row.addEventListener('click', () => {
          if (activeTypes.has(t)) { activeTypes.delete(t); row.classList.add('is-off'); }
          else { activeTypes.add(t); row.classList.remove('is-off'); }
          applyFilters();
        });
        filterList.appendChild(row);
      });

      // ----- Single-choice filters (deployments, health) -----
      function radioRows(container, rows, current, onPick) {
        container.innerHTML = rows.map(r => `
          <div class="filter-row radio${r.value === current ? ' is-selected' : ''}" data-value="${esc(r.value)}" title="${esc(r.title || '')}">
            <span class="filter-swatch" style="background:${r.color}"></span>
            <span class="filter-name">${esc(r.label)}</span>
            ${r.badge ? `<span class="badge${r.badgeOff ? ' off' : ''}">${esc(r.badge)}</span>` : ''}
            <span class="filter-count">${r.count}</span>
          </div>`).join('');
        container.querySelectorAll('.filter-row').forEach(el => el.addEventListener('click', () => {
          container.querySelectorAll('.filter-row').forEach(x => x.classList.remove('is-selected'));
          el.classList.add('is-selected');
          onPick(el.dataset.value);
        }));
      }

      const deployList = document.getElementById('deploy-list');
      const deployNote = document.getElementById('deploy-note');
      function renderDeployFilter() {
        if (!DEPLOYMENTS) {
          deployList.innerHTML = '';
          deployNote.innerHTML = 'Deployments were not fetched for this build.';
          return;
        }
        const rows = [{ value: 'all', label: 'All assets', color: '#9B9BA8', count: ASSETS.length }];
        ENVIRONMENTS.forEach(e => {
          const st = depStatus(e.key) || { status: 'skipped', reason: 'not fetched' };
          rows.push({
            value: e.key, label: `Deployed in ${e.name}`, color: envColor(e),
            count: ASSETS.filter(a => depOf(a.k).some(d => d.env === e.key)).length,
            badge: st.status === 'partial' ? 'partial' : st.status === 'skipped' ? 'not fetched' : '',
            badgeOff: st.status === 'skipped',
            title: (st.reason || `${e.purpose}: complete listing (${st.shown} deployments)`)
              + (unlistedIn(e.key).length ? `; ${unlistedIn(e.key).length} more deployed asset(s) are not in the asset list (see the Table view)` : '')
          });
        });
        rows.push({
          value: 'drift', label: 'Revision drift', color: '#FBBF24',
          count: Object.keys(DEPLOYMENTS.drift || {}).length,
          title: 'Latest revision (app_list) is ahead of the revision running in the highest environment the asset is deployed in'
        });
        rows.push({
          value: 'none', label: depIncomplete.length ? 'Not in any deployment list' : 'Not deployed anywhere',
          color: '#6B6B7A', count: ASSETS.filter(a => listedTypes.has(a.t) && !depOf(a.k).length).length,
          badge: depIncomplete.length ? 'incomplete' : ''
        });
        radioRows(deployList, rows, envFilter, v => { envFilter = v; applyFilters(); });
        deployNote.innerHTML =
          `Environment edges are drawn for the selected environment only. "Not deployed" covers ` +
          `<b>${esc([...listedTypes].map(t => typeMeta(t).label).join(', '))}</b>, the types env_apps lists: ` +
          `libraries ship inside the apps that consume them and env_apps does not list Workflows.` +
          (depIncomplete.length
            ? ` <b>${depIncomplete.length} environment list${depIncomplete.length === 1 ? ' is' : 's are'} partial or not fetched</b> ` +
              `(${esc(depIncomplete.map(e => e.name).join(', '))}), so an asset shown as not deployed may still be deployed there.`
            : '') +
          (depUnlisted.length
            ? ` <b>${depUnlisted.length} deployed asset${depUnlisted.length === 1 ? ' is' : 's are'} not in the asset list</b> ` +
              `(${esc(ENVIRONMENTS.filter(e => unlistedIn(e.key).length).map(e => `${e.name} ${unlistedIn(e.key).length}`).join(', '))}): ` +
              `env_apps lists them but they have no source-control record, so app_list does not return them (typically orphaned agent definitions) and they have no node; the Table view lists them in a section of their own.`
            : '');
      }

      const healthList = document.getElementById('health-list');
      const healthNote = document.getElementById('health-note');
      function renderHealthFilter() {
        const envKeys = Object.keys(healthEnvs);
        document.getElementById('health-title').textContent =
          envKeys.length ? `Health · ${envKeys.map(envName).join(', ')} · ${winLabel}` : 'Health';
        if (!HEALTH) {
          healthList.innerHTML = '';
          healthNote.innerHTML = 'The health overlay was not fetched for this build.';
          return;
        }
        if (HEALTH.skipped) {
          healthList.innerHTML = '';
          healthNote.innerHTML = `Health overlay skipped: ${esc(HEALTH.skipped)}.`;
          return;
        }
        const n = cls => ASSETS.filter(a => (healthOf(a.k) || {}).cls === cls).length;
        radioRows(healthList, [
          { value: 'all', label: 'All assets', color: '#9B9BA8', count: ASSETS.length },
          { value: 'errors', label: `Had errors (${winLabel})`, color: '#FF3D52', count: n('errors'),
            title: 'errors > 0, errorPercent > 0 or a lastErrorOccurred inside the window' },
          { value: 'noTraffic', label: `No traffic recorded (${winLabel})`, color: '#6B6B7A', count: n('noTraffic'),
            title: 'requests reads 0, or deployed here with no row in a result set proven complete' },
          { value: 'noReading', label: 'No reading', color: '#353548', count: n('noReading'),
            title: 'requests unavailable, or no row in a result set that was not proven complete' }
        ], healthFilter, v => { healthFilter = v; applyFilters(); });
        const lines = envKeys.map(k => {
          const s = healthEnvs[k];
          if (s.status === 'skipped') return `<b>${esc(envName(k))}</b>: skipped (${esc(s.reason)}).`;
          let t = `<b>${esc(envName(k))}</b>: ${s.status === 'complete' ? 'complete result set' : 'partial — no-traffic claims withheld (' + esc(s.reason) + ')'}.`;
          if (s.advisory) t += ` ${esc(s.advisory)}`;
          if (s.unresolved && s.unresolved.length) t += ` ${s.unresolved.length} identifier(s) unresolved.`;
          return t;
        });
        healthNote.innerHTML = lines.join('<br>') +
          `<br>app_health figures over ${esc(fmtIso(HEALTH.since))} → ${esc(fmtIso(HEALTH.to))}. ` +
          `An inventory view, not an incident view: a ${esc(winLabel)} window averages short incidents away. ` +
          `The latency score (appScore) is deliberately not shown; it is not a health verdict.`;
      }

      const aiList = document.getElementById('ai-list');
      const aiNote = document.getElementById('ai-note');
      function renderAiFilter() {
        if (!AI) { aiList.innerHTML = ''; aiNote.innerHTML = 'The AI governance data was not fetched for this build.'; return; }
        if (AI.status === 'skipped') { aiList.innerHTML = ''; aiNote.innerHTML = `AI governance skipped: ${esc(AI.reason)}.`; return; }
        const st = AI.stats;
        const onAsset = pred => ASSETS.filter(a => { const r = aiOf(a.k); return r && pred(r); }).length;
        const rows = [{ value: 'all', label: 'All assets', color: '#9B9BA8', count: ASSETS.length }];
        st.providers.forEach(p => rows.push({ value: `p:${p.name}`, label: `Provider: ${p.name}`, color: '#E94EAB',
          count: onAsset(r => r.kind === 'connection' && r.provider === p.name) }));
        ['Trial', 'Customer', 'not reported'].forEach(e => rows.push({ value: `e:${e}`, label: `Entitlement: ${e}`,
          color: e === 'Trial' ? '#FBBF24' : e === 'Customer' ? '#34D399' : '#6B6B7A',
          count: onAsset(r => r.kind === 'connection' && r.entitlement === e) }));
        rows.push({ value: 'testDemo', label: 'Agent named like test/demo', color: '#FB923C', count: onAsset(r => r.kind === 'agent' && r.testDemo),
          title: 'Name matches test, tmp, demo, sample, scratch, wip, untitled… (a heuristic)' });
        rows.push({ value: 'stale', label: `Agent not updated in ${st.staleDays}+ days`, color: '#6B6B7A', count: onAsset(r => r.kind === 'agent' && r.stale) });
        rows.push({ value: 'public', label: 'Agent marked public', color: '#60A5FA', count: onAsset(r => r.kind === 'agent' && r.pub) });
        rows.push({ value: 'uncovered', label: 'AI asset not reported by the source', color: '#353548',
          count: ASSETS.filter(a => isAiType(a.t) && !aiOf(a.k)).length,
          title: 'Agent definitions, knowledge bases and non-model connections are not covered by context_agents / context_connections' });
        radioRows(aiList, rows, aiFilter, v => { aiFilter = v; applyFilters(); });
        aiNote.innerHTML = `${st.totalAgents} agents and ${st.totalConnections} AI model connections from context_agents / context_connections. ` +
          `These cover <b>Agent</b> apps and <b>AI model connections</b> only: agent definitions, knowledge bases and MCP / search / A2A connections are not reported by this source.` +
          (AI.unlisted && AI.unlisted.length ? ` <b>${AI.unlisted.length}</b> indexed row(s) are not in the asset list (see the AI governance view).` : '');
      }

      renderDeployFilter();
      renderHealthFilter();
      renderAiFilter();

      document.getElementById('filter-reset').addEventListener('click', () => {
        activeTypes.clear();
        presentTypes.forEach(t => activeTypes.add(t));
        document.querySelectorAll('#filter-list .filter-row').forEach(r => r.classList.remove('is-off'));
        searchInput.value = '';
        envFilter = 'all'; healthFilter = 'all'; aiFilter = 'all';
        renderDeployFilter(); renderHealthFilter(); renderAiFilter();
        applyFilters();
      });
      searchInput.addEventListener('input', applyFilters);

      // ----- Table view (also the offline fallback) -----
      const tableView = document.getElementById('table-view');
      const healthLabel = { errors: 'had errors', traffic: 'traffic', noTraffic: 'no traffic', noReading: 'no reading' };
      function renderTable() {
        const rows = ASSETS.filter(isVisible).sort((a, b) => (a.n || '').localeCompare(b.n || ''));
        tableView.innerHTML = `
          <table class="asset-table">
            <thead><tr><th>Name</th><th>Type</th><th>Latest</th><th>Updated</th><th>Deployed in</th><th>Drift</th><th>Health (${esc(winLabel)})</th><th>AI governance</th></tr></thead>
            <tbody>${rows.map(a => {
              const m = typeMeta(a.t);
              const deps = depOf(a.k).map(d => `${esc(envName(d.env))} r${esc(d.rev)}`).join(' · ');
              const dr = driftOf(a.k);
              const h = healthOf(a.k);
              return `<tr data-key="${esc(a.k)}">
                <td>${a.n ? esc(a.n) : '<span class="dim">—</span>'}</td>
                <td><span class="swatch" style="background:${m.color}"></span>${esc(m.label)}</td>
                <td>r${esc(a.r)}</td>
                <td class="dim">${esc(a.d)}</td>
                <td>${deps || '<span class="dim">—</span>'}</td>
                <td>${dr ? `<span class="drift">r${esc(dr.deployed)} → r${esc(dr.latest)}</span>` : ''}</td>
                <td>${h ? esc(healthLabel[h.cls] || h.cls) : '<span class="dim">—</span>'}</td>
                <td>${aiCell(a)}</td>
              </tr>`;
            }).join('')}</tbody>
          </table>
          <div class="panel-note" style="margin:10px 0 0">${rows.length} of ${ASSETS.length} assets shown.</div>
          ${unlistedTable()}`;
        tableView.querySelectorAll('tbody tr').forEach(tr =>
          tr.addEventListener('click', () => tr.dataset.unlisted ? showUnlisted(tr.dataset.key) : showAsset(tr.dataset.key)));
      }

      // Deployed but not in the asset list: follows the search box and the
      // environment filter, not the type / health / AI filters (no type known).
      function unlistedTable() {
        if (!depUnlisted.length) return '';
        const q = (searchInput.value || '').trim().toLowerCase();
        const rows = depUnlisted.filter(u =>
          (!q || u.n.toLowerCase().includes(q))
          && (envFilter === 'all' || u.deps.some(d => d.env === envFilter)));
        if (!rows.length) return '';
        return `
          <h3 style="font-size:13px;margin:22px 0 4px">Deployed, not in the asset list (${rows.length})</h3>
          <div class="panel-note" style="margin:0 0 8px">env_apps lists these deployments but the asset has no source-control record, so app_list does not return it (typically an orphaned agent definition). They have no node in the graph.</div>
          <table class="asset-table">
            <thead><tr><th>Name (from env_apps)</th><th>Type</th><th>Deployed in</th><th>Key</th></tr></thead>
            <tbody>${rows.map(u => `<tr data-key="${esc(u.k)}" data-unlisted="1">
                <td>${esc(u.n)}</td>
                <td>${u.t ? `<span class="swatch" style="background:${typeMeta(u.t).color}"></span>${esc(typeMeta(u.t).label)}` : '<span class="dim">not reported</span>'}</td>
                <td>${u.deps.map(d => `${esc(envName(d.env))} r${esc(d.rev)}`).join(' · ')}</td>
                <td class="dim" style="font-size:10px">${esc(u.k)}</td></tr>`).join('')}</tbody>
          </table>`;
      }

      function aiCell(a) {
        const r = aiOf(a.k);
        if (r && r.kind === 'connection') return `${esc(r.provider)} · ${esc(r.entitlement)}`;
        if (r) return [r.pub ? 'public' : '', r.testDemo ? 'test/demo name' : '', r.stale ? 'stale' : ''].filter(Boolean).map(esc).join(' · ') || 'agent';
        return aiOn && isAiType(a.t) ? '<span class="dim">not reported</span>' : '';
      }

      // ----- AI governance view -----
      const aiView = document.getElementById('ai-view');
      function renderAiView() {
        if (!AI) { aiView.innerHTML = '<div class="panel-note" style="margin:0">AI governance data was not fetched for this build.</div>'; return; }
        if (AI.status === 'skipped') { aiView.innerHTML = `<div class="panel-note" style="margin:0">AI governance skipped: ${esc(AI.reason)}.</div>`; return; }
        const st = AI.stats;
        const card = (n, l) => `<div class="ai-card"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`;
        const listed = r => r.listed ? '' : ' <span class="badge off">not in asset list</span>';
        aiView.innerHTML = `
          <div class="ai-cards">
            ${card(st.totalAgents, 'Agents (Agent apps)')}
            ${card(st.totalConnections, 'AI model connections')}
            ${card(st.trialConns, 'Trial connections')}
            ${card(st.customerConns, 'Customer connections')}
            ${card(st.unreportedEntitlementConns, 'Entitlement not reported')}
            ${card(st.testDemoAgents, 'Test/demo-named agents')}
            ${card(st.staleAgents, `Agents stale ${st.staleDays}+ days`)}
            ${card(st.publicAgents, 'Public agents')}
          </div>
          <h3>Providers</h3>
          <div class="ai-cards">${st.providers.map(p => card(p.count, p.name)).join('') || '<span class="dim">none</span>'}</div>
          <h3>AI model connections (${AI.connections.length})</h3>
          <table class="asset-table"><thead><tr><th>Name</th><th>Provider</th><th>Entitlement</th><th>Updated</th></tr></thead>
            <tbody>${AI.connections.map(c => `<tr data-key="${esc(c.k)}"><td>${esc(c.n)}${listed(c)}</td><td>${esc(c.provider)}</td><td>${esc(c.entitlement)}</td><td class="dim">${esc(c.date || '—')}</td></tr>`).join('')}</tbody></table>
          <h3>Agents (${AI.agents.length})</h3>
          <table class="asset-table"><thead><tr><th>Name</th><th>Flags</th><th>Updated</th></tr></thead>
            <tbody>${AI.agents.map(a => `<tr data-key="${esc(a.k)}"><td>${esc(a.n)}${listed(a)}</td><td>${[a.pub ? 'public' : '', a.testDemo ? 'test/demo name' : '', a.stale ? `stale ${st.staleDays}+ days` : ''].filter(Boolean).map(f => `<span class="flag">${esc(f)}</span>`).join('')}</td><td class="dim">${esc(a.date || '—')}</td></tr>`).join('')}</tbody></table>
          <div class="panel-note" style="margin:12px 0 0">Source: context_agents (asset type AIAgent) and context_connections (AI model connections), fetched ${esc(fmtTs(AI.fetched_at))}.
            Agent definitions, knowledge bases and MCP / search / A2A connections are not covered by this source; they appear in the graph and table as "not reported".
            "Not in asset list" rows are indexed by the Context Service but absent from app_list (for example deleted assets).
            The test/demo flag is a name heuristic, not a verdict.</div>`;
        aiView.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', () => showAsset(tr.dataset.key)));
      }

      let view = 'graph';
      function setView(v) {
        view = v;
        document.getElementById('view-graph').classList.toggle('is-on', v === 'graph');
        document.getElementById('view-table').classList.toggle('is-on', v === 'table');
        document.getElementById('view-ai').classList.toggle('is-on', v === 'ai');
        document.getElementById('network').hidden = v !== 'graph';
        tableView.hidden = v !== 'table';
        aiView.hidden = v !== 'ai';
        document.getElementById('legend-floating').hidden = v !== 'graph';
        document.getElementById('graph-controls').hidden = v !== 'graph';
        if (v === 'table') renderTable();
        if (v === 'ai') renderAiView();
      }
      document.getElementById('view-graph').addEventListener('click', () => setView('graph'));
      document.getElementById('view-table').addEventListener('click', () => setView('table'));
      document.getElementById('view-ai').addEventListener('click', () => setView('ai'));

      // ----- Detail panel -----
      const overlay = document.getElementById('overlay');
      const ovBody = document.getElementById('ov-body');
      const graphWrap = overlay.parentElement;
      const showOverlay = () => { overlay.classList.add('is-visible'); graphWrap.classList.add('has-detail'); };
      const hideOverlay = () => { overlay.classList.remove('is-visible'); graphWrap.classList.remove('has-detail'); };
      document.getElementById('ov-close').addEventListener('click', hideOverlay);
      const row = (k, v, cls) => `<div class="overlay-row"><span class="k">${esc(k)}</span><span class="v${cls ? ' ' + cls : ''}">${v}</span></div>`;
      const METRIC_LABELS = [
        ['requests', 'Requests'], ['errors', 'Errors'], ['errorPercent', 'Error %'],
        ['responseTimeP95', 'p95 response (ms)'], ['uniqueUsers', 'Unique users'], ['lastErrorOccurred', 'Last error']
      ];

      function showAiOnly(r) {
        ovBody.innerHTML = `
          <div class="overlay-title">${esc(r.n)}</div>
          <div class="overlay-type">${r.kind === 'agent' ? 'Agent' : 'AI model connection'} · not in the asset list</div>
          ${aiRows(r)}
          <div class="overlay-note">Indexed by the Context Service but absent from app_list (for example a deleted asset), so it has no node in the graph.</div>`;
        showOverlay();
      }
      function showUnlisted(k) {
        const u = depUnlisted.find(x => x.k === k);
        if (!u) return;
        ovBody.innerHTML = `
          <div class="overlay-title">${esc(u.n)}</div>
          <div class="overlay-type">${u.t ? esc(typeMeta(u.t).label) + ' · ' : ''}Deployed · not in the asset list</div>
          ${row('Key', `<span style="font-size:9px;user-select:all">${esc(u.k)}</span>`)}
          <div class="overlay-section">Deployments</div>
          ${u.deps.map(d => row(envName(d.env), `r${esc(d.rev)} · ${esc(d.date || '—')}${d.url ? ` · <a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">open</a>` : ''}`)).join('')}
          <div class="overlay-note">env_apps lists this deployment but the asset has no source-control record, so app_list does not return it (typically an orphaned agent definition). Its latest revision and drift are unknown.</div>`;
        showOverlay();
      }
      function aiRows(r) {
        if (r.kind === 'connection') return row('Provider', esc(r.provider)) + row('Entitlement', esc(r.entitlement)) + row('Updated', esc(r.date || '—'));
        return row('Public', r.pub ? 'yes' : 'no') + row('Updated', esc(r.date || '—'))
          + row('Name heuristic', r.testDemo ? 'looks like test/demo' : '—') + row(`Stale (${AI.stats.staleDays}+ days)`, r.stale ? 'yes' : 'no');
      }

      function showAsset(k) {
        const a = ASSETS.find(x => x.k === k);
        if (!a) { const r = aiOf(k); if (r) showAiOnly(r); return; }
        const m = typeMeta(a.t);
        let html = `
          <div class="overlay-title"><span style="width:8px;height:8px;border-radius:50%;background:${m.color};display:inline-block;"></span>${esc(a.n || '—')}</div>
          <div class="overlay-type">${esc(m.label)}${TYPES[a.t] ? '' : ' (unrecognised type)'}</div>
          ${row('Latest revision', `r${esc(a.r)}`)}
          ${row('Updated', esc(a.d || '—'))}
          ${row('External', a.x ? 'Yes (Forge)' : 'No (Tenant-owned)')}
          ${row('Key', `<span style="font-size:9px;user-select:all">${esc(a.k)}</span>`)}`;

        // Deployments
        html += `<div class="overlay-section">Deployments</div>`;
        const deps = depOf(a.k);
        if (!DEPLOYMENTS) {
          html += `<div class="overlay-note">Not fetched for this build.</div>`;
        } else if (!listedTypes.has(a.t) && !deps.length) {
          html += `<div class="overlay-note">Not tracked for this type: env_apps lists ${esc([...listedTypes].map(t => typeMeta(t).label).join(', '))}. Libraries ship inside the apps that consume them.</div>`;
        } else {
          ENVIRONMENTS.forEach(e => {
            const d = deps.find(x => x.env === e.key);
            const st = (depStatus(e.key) || {}).status;
            if (d) {
              const link = d.url ? ` · <a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">open</a>` : '';
              html += row(e.name, `r${esc(d.rev)} · ${esc(d.date || '—')}${link}`);
              if (d.as) html += `<div class="overlay-note">Deployed in ${esc(e.name)} as <b>${esc(d.as)}</b> (the name at the deployed revision).</div>`;
            } else {
              html += row(e.name, st === 'complete' ? 'not deployed' : st === 'partial' ? 'not in the partial list' : 'not fetched', 'na');
            }
          });
          const dr = driftOf(a.k);
          if (dr) html += `<div class="overlay-note drift">Revision drift: latest is r${esc(dr.latest)}, ${esc(envName(dr.env))} runs r${esc(dr.deployed)}.</div>`;
        }

        // Health
        if (HEALTH && !HEALTH.skipped && Object.keys(healthEnvs).length) {
          html += `<div class="overlay-section">Health · ${esc(winLabel)} (not an incident view)</div>`;
          const h = healthOf(a.k);
          Object.keys(healthEnvs).forEach(key => {
            const s = healthEnvs[key];
            const r = h && h.by_env ? h.by_env[key] : null;
            if (s.status === 'skipped') {
              html += row(envName(key), `skipped (${esc(s.reason)})`, 'na');
            } else if (r && !r.absent) {
              html += `<div class="overlay-note"><b>${esc(envName(key))}</b></div>`;
              const requested = new Set(s.metrics || []);
              METRIC_LABELS.forEach(([f, label]) => {
                if (f in r) html += row(label, esc(r[f]));
                else html += row(label, requested.has(f) ? 'unavailable' : 'not requested', 'na');
              });
            } else if (r && r.absent) {
              html += row(envName(key), r.cls === 'noTraffic'
                ? 'no traffic recorded (deployed, no row in a complete result set)'
                : 'no reading (result set not proven complete)', 'na');
            } else {
              const deployedHere = deps.some(d => d.env === key);
              const st = (depStatus(key) || {}).status;
              // "Not deployed here" needs env_apps to be able to list the
              // type at all: a Workflow, library or knowledge base never
              // shows up there, so its absence proves nothing.
              const verdict = !listedTypes.has(a.t) ? 'no reading (deployment not tracked for this type)'
                : (!deployedHere && st === 'complete' ? 'not deployed here' : 'no reading');
              html += row(envName(key), verdict, 'na');
            }
          });
        }
        // AI governance
        if (AI && isAiType(a.t)) {
          html += `<div class="overlay-section">AI governance</div>`;
          const r = aiOf(a.k);
          if (AI.status === 'skipped') html += `<div class="overlay-note">Skipped: ${esc(AI.reason)}.</div>`;
          else if (r) html += aiRows(r);
          else html += `<div class="overlay-note">Not reported by the governance source (context_agents / context_connections cover Agent apps and AI model connections only).</div>`;
        }
        ovBody.innerHTML = html;
        showOverlay();
      }

      function showNode(node) {
        const m = node.meta || {};
        let html = `<div class="overlay-title">${esc(m.name || node.label || node.id)}</div><div class="overlay-type">${esc(m.type || '—')}</div>`;
        if (m.type === 'Environment') {
          const st = depStatus(m.key);
          html += row('Purpose', esc(m.purpose || '—')) + row('Host', esc(m.host || '—'));
          if (DEPLOYMENTS) {
            html += row('Deployments', !st ? 'not fetched'
              : st.status === 'complete' ? `${esc(st.shown)} (complete)`
              : st.status === 'partial' ? `${esc(st.shown)} of ${esc(st.total)} (partial)` : `not fetched`);
            if (st && st.reason) html += `<div class="overlay-note">${esc(st.reason)}</div>`;
            html += `<div class="overlay-note">Pick "Deployed in ${esc(m.name)}" in the sidebar to draw its edges.</div>`;
          }
        }
        ovBody.innerHTML = html;
        showOverlay();
      }

      // ----- Graph (only once vis-network has loaded) -----
      let graph = null;
      let envEdgeIds = [];

      function updateEnvEdges() {
        if (!graph) return;
        graph.edges.remove(envEdgeIds);
        envEdgeIds = [];
        const e = envByKey[envFilter];
        if (!e) return;
        const c = envColor(e);
        const add = ASSETS
          .filter(a => isVisible(a) && depOf(a.k).some(d => d.env === e.key))
          .map(a => ({ id: `envedge-${a.k}`, from: `env-${e.key}`, to: a.k, color: { color: c, opacity: 0.45 }, width: 1 }));
        graph.edges.add(add);
        envEdgeIds = add.map(x => x.id);
      }

      function applyFilters() {
        if (graph) {
          // A type box or hub with nothing visible under it is hidden too, so
          // an environment or health filter leaves only the relevant branches.
          const shownTypes = new Set();
          const updates = ASSETS.map(a => {
            const on = isVisible(a);
            if (on) shownTypes.add(a.t);
            return { id: a.k, hidden: !on };
          });
          presentTypes.forEach(t => updates.push({ id: `type-${t}`, hidden: !shownTypes.has(t) }));
          HUBS.forEach(h => {
            if (!graph.nodes.get(`hub-${h}`)) return;
            const anyOn = presentTypes.some(t => typeMeta(t).hub === h && shownTypes.has(t));
            updates.push({ id: `hub-${h}`, hidden: !anyOn });
          });
          graph.nodes.update(updates);
          updateEnvEdges();
        }
        if (view === 'table') renderTable();
      }

      function renderGraph() {
        const loading = document.getElementById('graph-loading');
        if (loading) loading.remove();
        const nodes = new vis.DataSet();
        const edges = new vis.DataSet();

        // Tenant root
        nodes.add({
          id: 'tenant',
          label: TENANT.realm || 'tenant',
          title: TENANT.hostname || 'Tenant root',
          color: { background: '#FFFFFF', border: '#FF3D52', highlight: { background: '#fff', border: '#FF3D52' } },
          font: { color: '#0A0A0F', size: 20, face: FONT },
          shape: 'dot', size: 38, borderWidth: 3,
          meta: { type: 'Tenant', name: TENANT.hostname || TENANT.realm }
        });

        // Environments
        ENVIRONMENTS.forEach(e => {
          const c = envColor(e);
          nodes.add({
            id: `env-${e.key}`,
            label: e.name,
            title: `${e.name}\n${e.host || ''}`,
            color: { background: '#0A0A0F', border: c },
            font: { color: c, size: 14, face: FONT },
            shape: 'hexagon', size: 22, borderWidth: 2,
            meta: { type: 'Environment', name: e.name, key: e.key, host: e.host, purpose: e.purpose }
          });
          edges.add({
            from: 'tenant', to: `env-${e.key}`,
            color: { color: '#3A3A4A', opacity: 0.8 }, width: 2
          });
        });

        // Category hubs (only those with assets)
        HUBS.filter(h => presentTypes.some(t => typeMeta(t).hub === h)).forEach(h => {
          nodes.add({
            id: `hub-${h}`, label: h, title: `${h} category hub`,
            color: { background: '#1F1F2A', border: '#5B5B6E' },
            font: { color: '#D8D8E0', size: 15, face: FONT, bold: true },
            shape: 'box', shapeProperties: { borderRadius: 8 },
            borderWidth: 2, margin: 10,
            meta: { type: 'Hub', name: h }
          });
          edges.add({
            from: 'tenant', to: `hub-${h}`,
            color: { color: '#4A4A5A', opacity: 0.6 }, width: 2.5
          });
        });

        // Type sub-hubs
        presentTypes.forEach(t => {
          const m = typeMeta(t);
          const c = counts[t] || 0;
          nodes.add({
            id: `type-${t}`,
            label: `${m.label}\n${c}`,
            title: `${m.label} (${c})`,
            color: { background: '#15151E', border: m.color },
            font: { color: m.color, size: 12, face: FONT, bold: true },
            shape: 'box', shapeProperties: { borderRadius: 6 },
            borderWidth: 2, margin: 8,
            meta: { type: 'AssetTypeHub', name: m.label }
          });
          edges.add({
            from: `hub-${m.hub}`, to: `type-${t}`,
            color: { color: m.color, opacity: 0.4 }, width: 1.5
          });
        });

        // Asset nodes
        ASSETS.forEach(a => {
          const m = typeMeta(a.t);
          const isExt = !!a.x;
          const dr = driftOf(a.k);
          nodes.add({
            id: a.k,
            label: a.n && a.n.length > 28 ? a.n.substring(0, 26) + '…' : (a.n || '—'),
            title: `${a.n}\n${m.label} · rev ${a.r}${dr ? `\nrevision drift: ${envName(dr.env)} runs r${dr.deployed}` : ''}`,
            color: {
              background: isExt ? '#0F0F18' : m.color + '22',
              border: dr ? '#FBBF24' : m.color,
              highlight: { background: m.color + '55', border: '#fff' }
            },
            font: { color: '#E8E8F0', size: 10, face: FONT },
            shape: 'dot',
            shapeProperties: dr ? { borderDashes: [3, 2] } : {},
            size: Math.max(6, Math.min(14, 6 + Math.log((a.r || 1) + 1) * 2)),
            borderWidth: dr ? 2 : (isExt ? 1 : 1.5),
            meta: { type: 'Asset', key: a.k }
          });
          edges.add({
            from: `type-${a.t}`, to: a.k,
            color: { color: m.color, opacity: 0.15 }, width: 0.6
          });
        });

        const container = document.getElementById('network');
        const options = {
          autoResize: true,
          nodes: { shadow: { enabled: true, color: 'rgba(0,0,0,0.5)', size: 8, x: 0, y: 2 } },
          edges: { smooth: { enabled: true, type: 'continuous', roundness: 0.4 } },
          physics: {
            enabled: true,
            solver: 'forceAtlas2Based',
            forceAtlas2Based: {
              gravitationalConstant: -55,
              centralGravity: 0.012,
              springLength: 130,
              springConstant: 0.08,
              damping: 0.55,
              avoidOverlap: 0.6
            },
            stabilization: { iterations: 220, updateInterval: 50 },
            timestep: 0.45
          },
          interaction: { hover: true, tooltipDelay: 200, zoomView: true, dragNodes: true },
          layout: { improvedLayout: true }
        };

        const network = new vis.Network(container, { nodes, edges }, options);
        graph = { network, nodes, edges };

        network.once('stabilizationIterationsDone', () => {
          network.setOptions({ physics: { enabled: false } });
          network.fit({ animation: { duration: 800, easingFunction: 'easeInOutCubic' } });
        });

        network.on('click', params => {
          if (!params.nodes.length) { hideOverlay(); return; }
          const node = nodes.get(params.nodes[0]);
          if (node.meta && node.meta.type === 'Asset') showAsset(node.meta.key);
          else showNode(node);
        });

        document.getElementById('zoom-fit').addEventListener('click', () =>
          network.fit({ animation: { duration: 600, easingFunction: 'easeInOutCubic' } })
        );
        document.getElementById('zoom-in').addEventListener('click', () => {
          const s = network.getScale();
          network.moveTo({ scale: s * 1.25, animation: { duration: 200 } });
        });
        document.getElementById('zoom-out').addEventListener('click', () => {
          const s = network.getScale();
          network.moveTo({ scale: s * 0.8, animation: { duration: 200 } });
        });
        applyFilters();
      }

      function graphUnavailable() {
        const banner = document.getElementById('banner');
        banner.textContent = 'Graph library could not load (offline or blocked CDN: unpkg.com and cdn.jsdelivr.net) — the asset table below still works, with every filter and the detail panel.';
        banner.hidden = false;
        tableView.classList.add('with-banner');
        document.getElementById('view-graph').disabled = true;
        setView('table');
      }

      return { renderGraph, graphUnavailable };
    }
  </script>
</body>
</html>
